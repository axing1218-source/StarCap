name: Patch Smart Element Detection

on:
  push:
    branches:
      - feature/snipaste-capture-ux
    paths:
      - .github/workflows/patch-smart-element-detection.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/snipaste-capture-ux
          fetch-depth: 0

      - name: Apply element-detection upgrade
        shell: python
        run: |
          from pathlib import Path

          p = Path('Src/Win/CutMask.cpp')
          text = p.read_text(encoding='utf-8')

          # Tutorial: user preferred only 10% smaller than the pre-shrink version.
          old_scale = '    const float scale = dpiScale * .70f;'
          new_scale = '    const float scale = dpiScale * .90f;'
          if old_scale not in text:
              raise SystemExit('Tutorial scale marker not found')
          text = text.replace(old_scale, new_scale, 1)

          # MSAA fallback support.
          if '#include <oleacc.h>' not in text:
              text = text.replace('#include <imm.h>\n', '#include <imm.h>\n#include <oleacc.h>\n', 1)
          if '#pragma comment(lib, "Oleacc.lib")' not in text:
              text = text.replace('#pragma comment(lib, "Imm32.lib")\n', '#pragma comment(lib, "Imm32.lib")\n#pragma comment(lib, "Oleacc.lib")\n', 1)

          start = text.index('D2D1_RECT_F CutMask::detectUiElementRect(HWND hwnd, POINT localPos, const D2D1_RECT_F& fallback)')
          end = text.index('\nD2D1_RECT_F CutMask::detectRegionAt(POINT pos, HWND* matchedWindow)', start)

          replacement = r'''D2D1_RECT_F CutMask::detectUiElementRect(HWND hwnd, POINT localPos, const D2D1_RECT_F& fallback)
{
	if (!hwnd) return fallback;
	POINT screenPos{ localPos.x + win->x, localPos.y + win->y };

	auto clippedCandidate = [&](const RECT& rr, const D2D1_RECT_F& parent, D2D1_RECT_F& out) {
		if (rr.right - rr.left < 3 || rr.bottom - rr.top < 3) return false;
		if (!PtInRect(&rr, screenPos)) return false;
		out = intersectRectF(rectFromScreenRect(rr, win), parent);
		const float area = rectArea(out);
		return validRect(out) && area >= 24.f;
	};

	auto semanticWeight = [](CONTROLTYPEID type) {
		// Prefer content-bearing leaves over generic layout containers when two
		// candidates under the cursor are otherwise similar in size.
		switch (type) {
		case UIA_TextControlTypeId:
		case UIA_ImageControlTypeId:
		case UIA_ButtonControlTypeId:
		case UIA_HyperlinkControlTypeId:
		case UIA_EditControlTypeId:
		case UIA_ListItemControlTypeId:
		case UIA_MenuItemControlTypeId:
			return .72f;
		case UIA_DocumentControlTypeId:
		case UIA_GroupControlTypeId:
		case UIA_PaneControlTypeId:
			return 1.08f;
		default:
			return 1.f;
		}
	};

	if (automation) {
		// Fast path. On applications that expose the underlying element despite
		// StarCap's capture overlay, ElementFromPoint gives the exact leaf directly.
		ComPtr<IUIAutomationElement> direct;
		if (SUCCEEDED(automation->ElementFromPoint(screenPos, direct.GetAddressOf())) && direct) {
			UIA_HWND nativeHandle{};
			RECT rr{};
			BOOL offscreen = FALSE;
			direct->get_CurrentNativeWindowHandle(&nativeHandle);
			if ((HWND)nativeHandle != win->hwnd &&
				SUCCEEDED(direct->get_CurrentIsOffscreen(&offscreen)) && !offscreen &&
				SUCCEEDED(direct->get_CurrentBoundingRectangle(&rr))) {
				D2D1_RECT_F local{};
				if (clippedCandidate(rr, fallback, local) && rectArea(local) < rectArea(fallback) * .995f)
					return local;
			}
		}

		// The capture overlay commonly wins ElementFromPoint. In that case start
		// from the real target HWND and walk RAW view instead of Control view.
		// Raw view preserves browser text fragments/images and other accessibility
		// nodes that Control view intentionally filters out.
		ComPtr<IUIAutomationElement> current;
		if (SUCCEEDED(automation->ElementFromHandle(hwnd, current.GetAddressOf())) && current) {
			ComPtr<IUIAutomationTreeWalker> walker;
			automation->get_RawViewWalker(walker.GetAddressOf());
			D2D1_RECT_F best = fallback;

			for (int depth = 0; walker && current && depth < 20; ++depth) {
				ComPtr<IUIAutomationElement> child;
				if (FAILED(walker->GetFirstChildElement(current.Get(), child.GetAddressOf())) || !child) break;

				ComPtr<IUIAutomationElement> winner;
				D2D1_RECT_F winnerRect{};
				float winnerScore = FLT_MAX;
				int siblingCount = 0;

				while (child && siblingCount++ < 512) {
					BOOL offscreen = FALSE;
					RECT rr{};
					if (SUCCEEDED(child->get_CurrentIsOffscreen(&offscreen)) && !offscreen &&
						SUCCEEDED(child->get_CurrentBoundingRectangle(&rr))) {
						D2D1_RECT_F local{};
						if (clippedCandidate(rr, best, local)) {
							const float area = rectArea(local);
							CONTROLTYPEID controlType{};
							child->get_CurrentControlType(&controlType);
							float score = area * semanticWeight(controlType);

							// Same-size wrapper nodes are useful for descending but should not
							// beat a genuinely smaller leaf at the same depth.
							if (sameRectRounded(local, best)) score *= 1.35f;
							if (score < winnerScore) {
								winnerScore = score;
								winnerRect = local;
								winner = child;
							}
						}
					}

					ComPtr<IUIAutomationElement> next;
					if (FAILED(walker->GetNextSiblingElement(child.Get(), next.GetAddressOf()))) break;
					child = next;
				}

				if (!winner) break;
				best = winnerRect;
				current = winner;
			}

			if (validRect(best) && rectArea(best) < rectArea(fallback) * .995f)
				return best;
		}
	}

	// Compatibility path for Chromium/Electron/legacy applications exposing a
	// richer MSAA tree than UI Automation. Starting from the target window keeps
	// StarCap's topmost capture overlay out of the accessibility hit-test.
	ComPtr<IAccessible> acc;
	if (SUCCEEDED(AccessibleObjectFromWindow(hwnd, OBJID_CLIENT, IID_IAccessible,
		reinterpret_cast<void**>(acc.GetAddressOf()))) && acc) {
		D2D1_RECT_F best = fallback;
		for (int depth = 0; acc && depth < 16; ++depth) {
			VARIANT hit{};
			VariantInit(&hit);
			if (FAILED(acc->accHitTest(screenPos.x, screenPos.y, &hit))) {
				VariantClear(&hit);
				break;
			}

			ComPtr<IAccessible> nextAcc;
			VARIANT locationId{};
			VariantInit(&locationId);
			locationId.vt = VT_I4;
			locationId.lVal = CHILDID_SELF;

			if (hit.vt == VT_DISPATCH && hit.pdispVal) {
				hit.pdispVal->QueryInterface(IID_PPV_ARGS(nextAcc.GetAddressOf()));
			}
			else if (hit.vt == VT_I4) {
				locationId.lVal = hit.lVal;
				if (hit.lVal != CHILDID_SELF) {
					ComPtr<IDispatch> childDispatch;
					if (SUCCEEDED(acc->get_accChild(locationId, childDispatch.GetAddressOf())) && childDispatch)
						childDispatch->QueryInterface(IID_PPV_ARGS(nextAcc.GetAddressOf()));
				}
			}

			IAccessible* locAcc = nextAcc ? nextAcc.Get() : acc.Get();
			VARIANT locChild{};
			VariantInit(&locChild);
			locChild.vt = VT_I4;
			locChild.lVal = nextAcc ? CHILDID_SELF : locationId.lVal;
			long l{}, t{}, w{}, h{};
			if (SUCCEEDED(locAcc->accLocation(&l, &t, &w, &h, locChild)) && w >= 3 && h >= 3) {
				RECT rr{ l, t, l + w, t + h };
				D2D1_RECT_F local{};
				if (clippedCandidate(rr, best, local)) best = local;
			}

			VariantClear(&hit);
			if (!nextAcc || nextAcc.Get() == acc.Get()) break;
			acc = nextAcc;
		}

		if (validRect(best) && rectArea(best) < rectArea(fallback) * .995f)
			return best;
	}

	return detectNativeChildRect(hwnd, localPos, fallback);
}
'''

          text = text[:start] + replacement + text[end:]
          p.write_text(text, encoding='utf-8')

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Win/CutMask.cpp
          git commit -m "Upgrade smart element detection"
          git push origin HEAD:feature/snipaste-capture-ux

      - name: Build feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run starcap-direct-build.yml --ref feature/snipaste-capture-ux

      - name: Remove temporary patch workflow
        shell: bash
        run: |
          git pull --rebase origin feature/snipaste-capture-ux
          git rm .github/workflows/patch-smart-element-detection.yml
          git commit -m "Remove temporary smart element patch workflow"
          git push origin HEAD:feature/snipaste-capture-ux
