name: Patch Magnifier Dual Target

on:
  push:
    branches:
      - feature/snipaste-capture-ux
    paths:
      - .github/workflows/patch-magnifier-dual-target.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/snipaste-capture-ux
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_magnifier_dual_target.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Win/CutMask.cpp
          git commit -m "Add dual-contrast magnifier target"
          git push origin HEAD:feature/snipaste-capture-ux
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run starcap-direct-build.yml --ref feature/snipaste-capture-ux
