name: Patch Pin Context And Help Width

on:
  push:
    branches:
      - feature/snipaste-capture-ux
    paths:
      - .github/workflows/patch-pin-context-help-width.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/snipaste-capture-ux
          fetch-depth: 0

      - name: Apply source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Exact tutorial-panel width: content + equal left/right padding.
          p = Path('Src/Win/CutMask.cpp')
          text = p.read_text(encoding='utf-8')
          start = text.index('void CutMask::paintHelp(ID2D1DeviceContext* ctx)')
          end = text.index('\nvoid CutMask::suppressLegacyMagnifier', start)
          replacement = r'''void CutMask::paintHelp(ID2D1DeviceContext* ctx)
          {
              if (!ctx || hideLabel) return;
              auto* cap = static_cast<WinCap*>(win);
              if (!cap || cap->stage != WinCap::CapStage::Select) return;

              const float scale = win->dpi;
              const bool dragging = cap->isPress;
              auto d2d = Ling::D2D::get();

              struct HelpRow
              {
                  std::vector<std::wstring> keys;
                  std::wstring desc;
              };

              std::vector<HelpRow> rows{
                  {{ L"W", L"A", L"S", L"D" }, L"移动鼠标指针 1 像素"},
                  {{ L"Tab" }, L"切换窗口 / 界面元素检测"},
                  {{ L"Ctrl", L"A" }, L"当前屏幕 / 全屏"}
              };
              if (!dragging) {
                  rows.push_back({ { L"R", L"Shift", L"R" }, L"使用上一次截图区域" });
                  rows.push_back({ { L",", L"." }, L"回溯截图区域历史" });
                  rows.push_back({ { L"C", L"Shift" }, L"复制颜色 / 切换 RGB/HEX" });
              }

              const float sidePad = 13.f * scale;
              const float keyGap = 5.f * scale;
              const float descGap = 10.f * scale;
              const float keyH = 21.f * scale;
              const float firstPad = 14.f * scale;
              const float bottomPad = 14.f * scale;
              const float step = 34.f * scale;

              // Measure exactly what will be painted. The longest rendered row determines
              // the panel width, then the same sidePad is added to both sides. This makes
              // the W key-cap's left edge -> panel edge distance equal to the final glyph
              // -> right panel edge distance, rather than relying on a guessed fixed width.
              float contentW = 0.f;
              for (const auto& row : rows) {
                  float rowW = 0.f;
                  for (size_t i = 0; i < row.keys.size(); ++i) {
                      auto keyLayout = d2d->makeTextLayout(row.keys[i], 11.5f * scale);
                      if (!keyLayout) continue;
                      DWRITE_TEXT_METRICS km{};
                      keyLayout->GetMetrics(&km);
                      rowW += std::max(21.f * scale, km.width + 9.f * scale);
                      if (i + 1 < row.keys.size()) rowW += keyGap;
                  }
                  auto descLayout = d2d->makeTextLayout(row.desc, 12.f * scale);
                  if (descLayout) {
                      DWRITE_TEXT_METRICS dm{};
                      descLayout->GetMetrics(&dm);
                      rowW += descGap + dm.width;
                  }
                  contentW = std::max(contentW, rowW);
              }

              const float panelW = sidePad + contentW + sidePad;
              const float panelH = firstPad + (rows.size() - 1) * step + keyH + bottomPad;

              POINT cursorScreen{};
              GetCursorPos(&cursorScreen);
              HMONITOR monitor = MonitorFromPoint(cursorScreen, MONITOR_DEFAULTTONEAREST);
              MONITORINFO mi{ sizeof(mi) };
              RECT work{ win->x, win->y, win->x + (LONG)std::lround(win->w), win->y + (LONG)std::lround(win->h) };
              if (monitor && GetMonitorInfoW(monitor, &mi)) work = mi.rcWork;

              const float workLeft = (float)(work.left - win->x);
              const float workTop = (float)(work.top - win->y);
              const float workRight = (float)(work.right - win->x);
              const float workBottom = (float)(work.bottom - win->y);
              const float margin = 14.f * scale;
              float left = workLeft + margin;
              float top = workBottom - margin - panelH;
              left = std::clamp(left, workLeft, std::max(workLeft, workRight - panelW));
              top = std::clamp(top, workTop, std::max(workTop, workBottom - panelH));

              const auto panel = D2D1::RectF(left, top, left + panelW, top + panelH);
              ctx->FillRectangle(panel, brushHelpBg.Get());
              // No outer white stroke. Key-cap strokes remain.

              auto drawRow = [&](float rowY, const HelpRow& row) {
                  float x = left + sidePad;
                  for (size_t i = 0; i < row.keys.size(); ++i) {
                      auto keyLayout = d2d->makeTextLayout(row.keys[i], 11.5f * scale);
                      if (!keyLayout) continue;
                      DWRITE_TEXT_METRICS km{};
                      keyLayout->GetMetrics(&km);
                      const float kw = std::max(21.f * scale, km.width + 9.f * scale);
                      ctx->DrawRectangle(D2D1::RectF(x, rowY, x + kw, rowY + keyH),
                          brushKeyBorder.Get(), std::max(1.f, scale));
                      ctx->DrawTextLayout({ x + (kw - km.width) * .5f, rowY + 1.5f * scale },
                          keyLayout.Get(), brushText.Get(), D2D1_DRAW_TEXT_OPTIONS_NONE);
                      x += kw;
                      if (i + 1 < row.keys.size()) x += keyGap;
                  }
                  auto descLayout = d2d->makeTextLayout(row.desc, 12.f * scale);
                  if (descLayout) ctx->DrawTextLayout({ x + descGap, rowY + 1.5f * scale },
                      descLayout.Get(), brushText.Get(), D2D1_DRAW_TEXT_OPTIONS_NONE);
              };

              const float firstY = top + firstPad;
              for (size_t i = 0; i < rows.size(); ++i)
                  drawRow(firstY + step * (float)i, rows[i]);
          }
          '''
          # Strip the workflow's indentation from the C++ replacement.
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          # 2) Stop WinPin itself from toggling/showing the edit toolbar on mouse clicks.
          p = Path('Src/Win/WinPin.cpp')
          text = p.read_text(encoding='utf-8')
          old_right_start = text.index('\tif (isRight) {', text.index('void WinPin::onDown'))
          old_right_end = text.index('\n\t// 双击判定', old_right_start)
          text = text[:old_right_start] + '\tif (isRight) return;\n' + text[old_right_end:]

          old = '''\tif (toolMain->curId == L"") {\n\t\t// 没选画笔，这一下要么是拖完窗口（按新位置重排工具条），要么只是点了一下 ——\n\t\t// 两种情况都把 ToolMain 显示出来：拖动期间它是藏着的，右键之后它也是藏着的，\n\t\t// 左键点一下就是"我还要用工具条"。ToolSub 由 curId 驱动，这会儿仍然不该出来，\n\t\t// layoutTools 里已经管了\n\t\tlayoutTools();\n\t\ttoolMain->show();\n\t}\n'''
          new = '''\tif (toolMain->curId == L"") {\n\t\t// Plain pin: a click/drag must never summon the editor toolbar.\n\t\t// ToolMain owns the desired visibility state and restores it after a drag\n\t\t// only when the user explicitly entered editor mode / enabled it from the menu.\n\t\tlayoutTools();\n\t}\n'''
          if old not in text:
              raise SystemExit('WinPin onUp block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # Let ToolMain use WinPin's existing scale implementation for the context submenu.
          p = Path('Src/Win/WinPin.h')
          text = p.read_text(encoding='utf-8')
          needle = 'class WinPin : public Ling::WinBase\n{\n\tfriend struct StarCapPinTransform;'
          repl = 'class WinPin : public Ling::WinBase\n{\n\tfriend struct StarCapPinTransform;\n\tfriend class ToolMain;'
          if needle not in text:
              raise SystemExit('WinPin friend insertion point not found')
          text = text.replace(needle, repl, 1)
          p.write_text(text, encoding='utf-8')

          # 3) Right-click menu similar to the reference: actions + checked toolbar + zoom submenu.
          p = Path('Src/Tool/ToolMain.cpp')
          text = p.read_text(encoding='utf-8')
          start = text.index('void ToolMain::showPinContextMenu()')
          end = text.index('\nvoid ToolMain::applyQueuedInitialTool()', start)
          replacement = r'''void ToolMain::showPinContextMenu()
          {
              if (!win || !win->hwnd) return;

              HMENU menu = CreatePopupMenu();
              HMENU zoomMenu = CreatePopupMenu();
              if (!menu || !zoomMenu) {
                  if (zoomMenu) DestroyMenu(zoomMenu);
                  if (menu) DestroyMenu(menu);
                  return;
              }

              constexpr UINT ID_COPY = 6101;
              constexpr UINT ID_SAVE = 6102;
              constexpr UINT ID_TOOLBAR = 6103;
              constexpr UINT ID_CLOSE = 6104;
              constexpr UINT ID_ZOOM_25 = 6201;
              constexpr UINT ID_ZOOM_50 = 6202;
              constexpr UINT ID_ZOOM_75 = 6203;
              constexpr UINT ID_ZOOM_100 = 6204;
              constexpr UINT ID_ZOOM_125 = 6205;
              constexpr UINT ID_ZOOM_150 = 6206;
              constexpr UINT ID_ZOOM_200 = 6207;

              AppendMenuW(menu, MF_STRING, ID_COPY, L"复制图像");
              AppendMenuW(menu, MF_STRING, ID_SAVE, L"图像另存为...");
              AppendMenuW(menu, MF_SEPARATOR, 0, nullptr);
              AppendMenuW(menu, MF_STRING | (pinToolbarVisible ? MF_CHECKED : MF_UNCHECKED), ID_TOOLBAR, L"显示工具栏");
              AppendMenuW(menu, MF_SEPARATOR, 0, nullptr);

              struct ZoomItem { UINT id; int percent; float value; };
              const ZoomItem zooms[] = {
                  { ID_ZOOM_25, 25, .25f }, { ID_ZOOM_50, 50, .50f }, { ID_ZOOM_75, 75, .75f },
                  { ID_ZOOM_100, 100, 1.00f }, { ID_ZOOM_125, 125, 1.25f },
                  { ID_ZOOM_150, 150, 1.50f }, { ID_ZOOM_200, 200, 2.00f }
              };
              for (const auto& z : zooms) {
                  const bool checked = std::abs(win->scale - z.value) < .01f;
                  AppendMenuW(zoomMenu, MF_STRING | (checked ? MF_CHECKED : MF_UNCHECKED),
                      z.id, std::format(L"{}%", z.percent).c_str());
              }
              AppendMenuW(menu, MF_POPUP, (UINT_PTR)zoomMenu, L"缩放");
              AppendMenuW(menu, MF_SEPARATOR, 0, nullptr);
              AppendMenuW(menu, MF_STRING, ID_CLOSE, L"关闭");

              POINT screenPt{};
              GetCursorPos(&screenPt);
              SetForegroundWindow(win->hwnd);
              const UINT cmd = TrackPopupMenu(menu, TPM_RETURNCMD | TPM_RIGHTBUTTON | TPM_NONOTIFY,
                  screenPt.x, screenPt.y, 0, win->hwnd, nullptr);
              DestroyMenu(menu); // destroys the attached zoom submenu as well
              PostMessageW(win->hwnd, WM_NULL, 0, 0);

              if (cmd == ID_TOOLBAR) {
                  pinToolbarVisible = !pinToolbarVisible;
                  applyPinToolbarVisibility();
                  return;
              }
              if (cmd == ID_COPY) { win->copyToClipboard(); return; }
              if (cmd == ID_SAVE) { win->saveToFile(); return; }
              if (cmd == ID_CLOSE) { win->close(); return; }

              float zoom = 0.f;
              for (const auto& z : zooms) if (cmd == z.id) { zoom = z.value; break; }
              if (zoom > 0.f) {
                  POINT anchor = screenPt;
                  ScreenToClient(win->hwnd, &anchor);
                  anchor.x = std::clamp<LONG>(anchor.x, 0, std::max<LONG>(0, (LONG)std::lround(win->w) - 1));
                  anchor.y = std::clamp<LONG>(anchor.y, 0, std::max<LONG>(0, (LONG)std::lround(win->h) - 1));
                  win->applyScale(zoom, anchor);
              }

              applyPinToolbarVisibility();
          }
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Win/CutMask.cpp Src/Win/WinPin.cpp Src/Win/WinPin.h Src/Tool/ToolMain.cpp
          git commit -m "Fix pin context menu and exact tutorial padding"
          git push origin HEAD:feature/snipaste-capture-ux

      - name: Build fixed feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run starcap-direct-build.yml --ref feature/snipaste-capture-ux

      - name: Remove temporary workflow
        shell: bash
        run: |
          git pull --rebase origin feature/snipaste-capture-ux
          git rm .github/workflows/patch-pin-context-help-width.yml
          git commit -m "Remove temporary pin context patch workflow"
          git push origin HEAD:feature/snipaste-capture-ux
