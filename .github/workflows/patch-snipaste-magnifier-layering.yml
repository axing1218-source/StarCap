name: Patch Snipaste Magnifier Layering

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/snipaste-capture-ux
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_snipaste_magnifier.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Win/CutMask.cpp
          git commit -m "Match Snipaste magnifier layering"
          git push origin HEAD:feature/snipaste-capture-ux
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run starcap-direct-build.yml --ref feature/snipaste-capture-ux
