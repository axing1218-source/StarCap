name: Patch Capture Help Panel

on:
  push:
    branches:
      - feature/snipaste-capture-ux
    paths:
      - .github/workflows/patch-capture-help-panel.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/snipaste-capture-ux
          fetch-depth: 0

      - name: Patch help panel
        shell: python
        run: |
          from pathlib import Path
          p = Path("Src/Win/CutMask.cpp")
          s = p.read_text(encoding="utf-8")
          old_w = '    const float panelW = (dragging ? 380.f : 405.f) * scale;'
          new_w = '    const float panelW = (dragging ? 342.f : 362.f) * scale;'
          old_border = '    ctx->DrawRectangle(panel, brushKeyBorder.Get(), std::max(1.f, scale));\n'
          if old_w not in s:
              raise SystemExit("help panel width line not found")
          if old_border not in s:
              raise SystemExit("help panel outer border line not found")
          s = s.replace(old_w, new_w, 1)
          s = s.replace(old_border, '', 1)
          p.write_text(s, encoding="utf-8")

      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Win/CutMask.cpp
          git commit -m "Tighten capture help panel spacing"
          git push origin HEAD:feature/snipaste-capture-ux

      - name: Build feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run starcap-direct-build.yml --ref feature/snipaste-capture-ux

      - name: Remove temporary workflow
        shell: bash
        run: |
          git pull --rebase origin feature/snipaste-capture-ux
          git rm .github/workflows/patch-capture-help-panel.yml
          git commit -m "Remove temporary help panel patch workflow"
          git push origin HEAD:feature/snipaste-capture-ux
