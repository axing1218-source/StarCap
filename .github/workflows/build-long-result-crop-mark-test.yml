          msbuild D:\project\Ling\Ling.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=D:\project\Ling\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build StarCap test executable
        shell: pwsh
        run: |
          msbuild Src\StarCap.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=${{ github.workspace }}\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test executable
        uses: actions/upload-artifact@v4
        with:
          name: StarCap-v0.10.10-long-result-crop-mark-test
          path: x64/Release/StarCap.exe
          if-no-files-found: error

      - name: Commit verified source and remove temporary files
        shell: pwsh
        run: |
          Remove-Item patch_long_result.py -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/build-long-result-crop-mark-test.yml -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Win/CapLong.h Src/Win/CapLong.cpp Src/Win/WinCap.cpp Src/Win/WinPin.cpp Src/Tool/ToolLong.h Src/Tool/ToolLong.cpp .github/workflows/build-long-result-crop-mark-test.yml
          git commit -m "Add completed long screenshot crop and annotation editing"
          git push origin HEAD:fix/long-result-crop-mark
