name: Integrate Capture Hover v5

on:
  push:
    branches:
      - feature/long-capture-next-v5

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        run: python3 tools/patch_capture_hover_v5.py
      - name: Commit source changes
        run: |
          if git diff --quiet -- Src/Win/CutMask.cpp Src/Win/CutMask.h; then
            echo 'No source changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Src/Win/CutMask.cpp Src/Win/CutMask.h
          git commit -m 'Defer fine element snapping until hover settles'
          git push origin HEAD:feature/long-capture-next-v5
