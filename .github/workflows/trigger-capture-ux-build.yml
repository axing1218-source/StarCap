name: Trigger Capture UX Verification Build

on:
  push:
    branches:
      - feature/snipaste-capture-ux
    paths:
      - .github/workflows/trigger-capture-ux-build.yml

permissions:
  contents: write
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/snipaste-capture-ux
          fetch-depth: 0
      - name: Start direct source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run starcap-direct-build.yml --ref feature/snipaste-capture-ux
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin feature/snipaste-capture-ux
          git rm .github/workflows/trigger-capture-ux-build.yml
          git commit -m "Remove temporary capture UX build trigger"
          git push origin HEAD:feature/snipaste-capture-ux
