name: Patch Browser Element Detection

on:
  push:
    branches:
      - feature/snipaste-capture-ux
    paths:
      - .github/workflows/patch-browser-element-detection.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/snipaste-capture-ux
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-browser-element-detection.py
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Win/CutMask.cpp Src/Win/CutMask.h
          git commit -m "Improve browser element hit testing and help alignment"
          git push origin HEAD:feature/snipaste-capture-ux
      - name: Build feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run starcap-direct-build.yml --ref feature/snipaste-capture-ux
      - name: Cleanup temporary files
        shell: bash
        run: |
          git pull --rebase origin feature/snipaste-capture-ux
          git rm .github/workflows/patch-browser-element-detection.yml .github/scripts/patch-browser-element-detection.py
          git commit -m "Remove temporary browser detection patch files"
          git push origin HEAD:feature/snipaste-capture-ux
