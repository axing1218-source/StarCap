name: Patch Editor Mode And Handles

on:
  push:
    branches:
      - feature/snipaste-capture-ux
    paths:
      - .github/workflows/patch-editor-mode-handles.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/snipaste-capture-ux
          fetch-depth: 0

      - name: Apply editor-mode and handle changes
        shell: python
        run: |
          from pathlib import Path

          # --- CutMask: hide handles on automatic preview and enlarge them 20%. ---
          p = Path('Src/Win/CutMask.cpp')
          text = p.read_text(encoding='utf-8')
          old = '''void CutMask::paintHandles(ID2D1DeviceContext* ctx)\n{\n\tif (!ctx || !hasRect() || hideLabel || !brushHandle) return;\n\tconst float radius = std::max(3.2f, 3.6f * win->dpi);\n\tfor (const auto& [p, _] : handlePoints()) {'''
          new = '''void CutMask::paintHandles(ID2D1DeviceContext* ctx)\n{\n\tif (!ctx || !hasRect() || hideLabel || !brushHandle) return;\n\tauto* cap = static_cast<WinCap*>(win);\n\t// Automatic element/window hover is only a preview: show the clean blue\n\t// outline without resize handles. Handles appear while manually dragging a\n\t// new selection and after the selection enters Adjust mode.\n\tif (cap && cap->stage == WinCap::CapStage::Select && !cap->isPress) return;\n\t// 20% larger than the previous 3.6*dpi handle radius.\n\tconst float radius = std::max(3.84f, 4.32f * win->dpi);\n\tfor (const auto& [p, _] : handlePoints()) {'''
          if old not in text:
              raise SystemExit('paintHandles block not found')
          text = text.replace(old, new, 1)
          text = text.replace('const float hitRadius = std::max(6.f, 6.f * win->dpi);',
                              'const float hitRadius = std::max(7.2f, 7.2f * win->dpi);', 1)
          p.write_text(text, encoding='utf-8')

          # --- WinPin.h: add a real editor mode and dedicated initializer. ---
          p = Path('Src/Win/WinPin.h')
          text = p.read_text(encoding='utf-8')
          text = text.replace('static void init(int x, int y, int w, int h);',
                              'static void init(int x, int y, int w, int h);\n\t// Annotation editor: same image/shape engine, but the captured image is fixed\n\t// in place and cannot be dragged like a desktop pin.\n\tstatic void initEditor(int x, int y, int w, int h);', 1)
          text = text.replace('WinPin(int x, int y, int w, int h, const std::vector<BYTE>* data = nullptr);',
                              'WinPin(int x, int y, int w, int h, const std::vector<BYTE>* data = nullptr, bool editorMode = false);', 1)
          text = text.replace('bool isMouseDown{ false }, isClosed{ false };',
                              'bool isMouseDown{ false }, isClosed{ false };\n\t// true only when opened from the screenshot "图像标记" action. In this\n\t// mode the capture is an editor canvas, not a movable desktop pin.\n\tbool editorMode{ false };', 1)
          p.write_text(text, encoding='utf-8')

          # --- WinPin.cpp: construct editor mode and disable pin dragging there. ---
          p = Path('Src/Win/WinPin.cpp')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'WinPin::WinPin(int x, int y, int w, int h, const std::vector<BYTE>* data) : Ling::WinBase(), history{ std::make_unique<History>(this) }',
              'WinPin::WinPin(int x, int y, int w, int h, const std::vector<BYTE>* data, bool editorMode) : Ling::WinBase(), history{ std::make_unique<History>(this) }, editorMode{ editorMode }', 1)

          init_marker = '''void WinPin::init(int x, int y, int w, int h)\n{\n\tauto ptr = new WinPin(x,y,w,h);\n\tstd::unique_ptr<WinPin> winPin{ ptr };\n\tptr->createNativeWindow(WS_EX_TOPMOST| WS_EX_TOOLWINDOW, WS_MAXIMIZEBOX | WS_MINIMIZEBOX | WS_POPUP);\n\twinPins.push_back(std::move(winPin));\n}\n'''
          init_new = init_marker + '''\nvoid WinPin::initEditor(int x, int y, int w, int h)\n{\n\tauto ptr = new WinPin(x, y, w, h, nullptr, true);\n\tstd::unique_ptr<WinPin> winPin{ ptr };\n\tptr->createNativeWindow(WS_EX_TOPMOST | WS_EX_TOOLWINDOW, WS_POPUP);\n\twinPins.push_back(std::move(winPin));\n}\n'''
          if init_marker not in text:
              raise SystemExit('WinPin::init block not found')
          text = text.replace(init_marker, init_new, 1)

          # No tool selected: editor canvas stays fixed; plain pin still drags.
          old_down = '''\t// 记的是按下点在窗口内的偏移（客户区坐标），拖动时用它把抓住的那一点保持在光标下\n\tpressPos.x = pos.x;\n\tpressPos.y = pos.y;\n\tisMouseDown = true;\n\thasDragged = false;\n\tSetCapture(hwnd);\n\tif (toolMain->curId == L"") { //没选画笔，左键是拖窗口，拖的时候把工具条收起来\n\t\ttoolMain->hide();\n\t\treturn;\n\t}\n'''
          new_down = '''\t// Editor mode is intentionally not a desktop pin. With no drawing tool\n\t// selected, a left press simply leaves the captured canvas fixed in place.\n\tif (editorMode && toolMain->curId == L"") return;\n\t// 记的是按下点在窗口内的偏移（客户区坐标），拖动时用它把抓住的那一点保持在光标下\n\tpressPos.x = pos.x;\n\tpressPos.y = pos.y;\n\tisMouseDown = true;\n\thasDragged = false;\n\tSetCapture(hwnd);\n\tif (toolMain->curId == L"") { // plain pin: no tool means drag the pinned window\n\t\ttoolMain->hide();\n\t\treturn;\n\t}\n'''
          if old_down not in text:
              raise SystemExit('WinPin onDown drag block not found')
          text = text.replace(old_down, new_down, 1)

          old_cursor = '''\tif (toolMain->curId == L"") {\n\t\tSetCursor(LoadCursor(nullptr, IDC_SIZEALL));\n\t\treturn TRUE;\n\t}\n'''
          new_cursor = '''\tif (toolMain->curId == L"") {\n\t\tSetCursor(LoadCursor(nullptr, editorMode ? IDC_ARROW : IDC_SIZEALL));\n\t\treturn TRUE;\n\t}\n'''
          if old_cursor not in text:
              raise SystemExit('WinPin cursor block not found')
          text = text.replace(old_cursor, new_cursor, 1)
          p.write_text(text, encoding='utf-8')

          # --- WinCap: dedicated screenshot editor entry point. ---
          p = Path('Src/Win/WinCap.h')
          text = p.read_text(encoding='utf-8')
          marker = '\tvoid startPin();'
          if marker not in text:
              raise SystemExit('WinCap startPin declaration not found')
          text = text.replace(marker, marker + '\n\tvoid startEditor();', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('Src/Win/WinCap.cpp')
          text = p.read_text(encoding='utf-8')
          start_pin = '''void WinCap::startPin()\n{\n    if (!cutMask->hasRect()) return;\n    auto& maskRect = cutMask->maskRect;\n    // WinPin 构造里会回头来取 getCutImg()，所以得先把它建起来再关自己\n    WinPin::init(int(maskRect.left) + x, int(maskRect.top) + y,\n        int(maskRect.right - maskRect.left), int(maskRect.bottom - maskRect.top));\n    close();\n}\n'''
          start_editor = start_pin + '''\nvoid WinCap::startEditor()\n{\n    if (!cutMask->hasRect()) return;\n    auto& maskRect = cutMask->maskRect;\n    // The annotation editor uses the same proven shape engine as WinPin, but\n    // opens in a dedicated fixed-canvas mode instead of desktop-pin mode.\n    ToolMain::queueEditorOpen();\n    WinPin::initEditor(int(maskRect.left) + x, int(maskRect.top) + y,\n        int(maskRect.right - maskRect.left), int(maskRect.bottom - maskRect.top));\n    close();\n}\n'''
          if start_pin not in text:
              raise SystemExit('WinCap startPin definition not found')
          text = text.replace(start_pin, start_editor, 1)
          p.write_text(text, encoding='utf-8')

          # --- ToolCap: mark calls dedicated editor instead of queue+plain pin. ---
          p = Path('Src/Tool/ToolCap.cpp')
          text = p.read_text(encoding='utf-8')
          old_mark = '''\tif (btn->id == L"mark") {\n\t\tToolMain::queueEditorOpen();\n\t\twin->startPin();\n\t}\n'''
          new_mark = '''\tif (btn->id == L"mark") {\n\t\twin->startEditor();\n\t}\n'''
          if old_mark not in text:
              raise SystemExit('ToolCap mark block not found')
          text = text.replace(old_mark, new_mark, 1)
          p.write_text(text, encoding='utf-8')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Win/CutMask.cpp Src/Win/WinPin.h Src/Win/WinPin.cpp Src/Win/WinCap.h Src/Win/WinCap.cpp Src/Tool/ToolCap.cpp
          git commit -m "Separate screenshot editor from pin mode"
          git push origin HEAD:feature/snipaste-capture-ux

      - name: Build feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run starcap-direct-build.yml --ref feature/snipaste-capture-ux

      - name: Cleanup temporary workflow
        shell: bash
        run: |
          git pull --rebase origin feature/snipaste-capture-ux
          git rm .github/workflows/patch-editor-mode-handles.yml
          git commit -m "Remove temporary editor-mode patch workflow"
          git push origin HEAD:feature/snipaste-capture-ux
