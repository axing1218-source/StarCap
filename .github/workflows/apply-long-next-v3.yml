name: Apply Long Capture Next v3

on:
  push:
    branches:
      - feature/long-capture-next-v3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate clean toolbar placement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Src/Win/CapLong.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''void CapLong::layoutTool()\n{\n    if (!tool) return;\n    auto& r = win->cutMask->maskRect;\n    int gap = std::max(2, static_cast<int>(2 * win->dpi));\n    int toolW = static_cast<int>(tool->w);\n    int toolH = static_cast<int>(tool->h);\n    int winW = static_cast<int>(win->w);\n    int winH = static_cast<int>(win->h);\n\n    int rightX = static_cast<int>(r.right) + gap;\n    int leftX = static_cast<int>(r.left) - toolW - gap;\n    int x = 0;\n    if (rightX + toolW <= winW) x = rightX;\n    else if (leftX >= 0) x = leftX;\n    else x = std::max(0, std::min(winW - toolW, static_cast<int>(r.right) - toolW - gap));\n\n    int y = static_cast<int>(r.bottom) - toolH;\n    y = std::max(0, std::min(winH - toolH, y));\n\n    POINT pos{ x, y };\n    ClientToScreen(win->hwnd, &pos);\n    tool->setPosition(pos.x, pos.y);\n}\n'''
          new = '''void CapLong::layoutTool()\n{\n    if (!tool) return;\n    auto& r = win->cutMask->maskRect;\n    int gap = std::max(2, static_cast<int>(2 * win->dpi));\n    int toolW = static_cast<int>(tool->w);\n    int toolH = static_cast<int>(tool->h);\n    int winW = static_cast<int>(win->w);\n    int winH = static_cast<int>(win->h);\n\n    int rightX = static_cast<int>(r.right) + gap;\n    int leftX = static_cast<int>(r.left) - toolW - gap;\n    int belowY = static_cast<int>(r.bottom) + gap;\n    int aboveY = static_cast<int>(r.top) - toolH - gap;\n\n    int x = 0;\n    int y = 0;\n    const wchar_t* placement = L"inside";\n\n    if (rightX + toolW <= winW) {\n        x = rightX;\n        y = std::max(0, std::min(winH - toolH, static_cast<int>(r.bottom) - toolH));\n        placement = L"right";\n    }\n    else if (leftX >= 0) {\n        x = leftX;\n        y = std::max(0, std::min(winH - toolH, static_cast<int>(r.bottom) - toolH));\n        placement = L"left";\n    }\n    else if (belowY + toolH <= winH) {\n        x = std::max(0, std::min(winW - toolW, static_cast<int>((r.left + r.right - toolW) / 2.0f)));\n        y = belowY;\n        placement = L"below";\n    }\n    else if (aboveY >= 0) {\n        x = std::max(0, std::min(winW - toolW, static_cast<int>((r.left + r.right - toolW) / 2.0f)));\n        y = aboveY;\n        placement = L"above";\n    }\n    else {\n        x = std::max(0, std::min(winW - toolW, static_cast<int>(r.right) - toolW - gap));\n        y = std::max(0, std::min(winH - toolH, static_cast<int>(r.bottom) - toolH));\n    }\n\n    POINT pos{ x, y };\n    ClientToScreen(win->hwnd, &pos);\n    tool->setPosition(pos.x, pos.y);\n    StarCapDiag::append(std::format(L"[long-next] toolbar-placement={} pos={},{} size={}x{}",\n        placement, x, y, toolW, toolH));\n}\n'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif 'toolbar-placement=' not in text:
              raise SystemExit('layoutTool anchor not found')

          wf = Path('.github/workflows/starcap-direct-build.yml')
          w = wf.read_text(encoding='utf-8')
          needle = '      - feature/long-capture-next\n'
          add = needle + '      - feature/long-capture-next-v3\n'
          if '      - feature/long-capture-next-v3\n' not in w:
              if needle not in w:
                  raise SystemExit('direct-build branch anchor not found')
              w = w.replace(needle, add, 1)
              wf.write_text(w, encoding='utf-8')
          PY

      - name: Commit integrated source
        shell: bash
        run: |
          if git diff --quiet -- Src/Win/CapLong.cpp .github/workflows/starcap-direct-build.yml; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Win/CapLong.cpp .github/workflows/starcap-direct-build.yml
          git commit -m "Prefer toolbar placement outside long capture region"
          git push origin HEAD:feature/long-capture-next-v3
