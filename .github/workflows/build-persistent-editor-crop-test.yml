name: Build persistent editor crop test

on:
  push:
    branches:
      - fix/long-result-crop-mark

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout StarCap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply persistent crop frame UX
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new, label):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              write(path, text.replace(old, new, 1))
              print('patched', label)

          # Remove the modal Crop tool from the annotation toolbar. Cropping is
          # now a persistent editor capability, like Snipaste's always-live frame.
          path = 'Src/Tool/ToolMain.cpp'
          replace_once(path,
              '''\tif (win && win->editorMode) {\n\t\tbtnIds.insert(btnIds.begin(), L"crop");\n\t\tbtnCodes.insert(btnCodes.begin(), L"裁");\n\t}\n''',
              '''''',
              'remove crop button insertion')
          replace_once(path,
              '''\t\t\tif (id == L"crop") {\n\t\t\t\tbtn->setFontFamily(L"Microsoft YaHei");\n\t\t\t\tbtn->setFontSize(12.f);\n\t\t\t}\n\t\t\telse if (id == L"rotate" || id == L"mirror") {\n''',
              '''\t\t\tif (id == L"rotate" || id == L"mirror") {\n''',
              'remove crop button font styling')
          replace_once(path,
              '''\tcurId = btn->id;\n\tif (curId == L"crop") {\n\t\twin->ensureCropRect();\n\t\twin->toolSub->hideTools();\n\t}\n\telse if (curId == L"rect") win->toolSub->showRectTools();\n''',
              '''\tcurId = btn->id;\n\tif (curId == L"rect") win->toolSub->showRectTools();\n''',
              'remove crop tool selection branch')

          # Persistent crop/trim frame in every screenshot annotation editor.
          path = 'Src/Win/WinPin.cpp'
          replace_once(path,
              '''void WinPin::paintCrop(ID2D1DeviceContext* ctx)\n{\n\tif (!editorMode || !toolMain || toolMain->curId != L"crop" || !cropInitialized || !cropShadeBrush || !cropBorderBrush) return;\n''',
              '''void WinPin::paintCrop(ID2D1DeviceContext* ctx)\n{\n\t// The crop frame is part of editor chrome, not a modal tool. Keep it visible\n\t// while drawing so users can trim any edge before or after annotations.\n\tif (!editorMode || !cropInitialized || !cropShadeBrush || !cropBorderBrush) return;\n''',
              'make crop frame always visible')
          replace_once(path,
              '''    d2d->deviceContext->CreateSolidColorBrush(D2D1::ColorF(0x000000, 0.42f), cropShadeBrush.GetAddressOf());\n    d2d->deviceContext->CreateSolidColorBrush(D2D1::ColorF(0x1677ff), cropBorderBrush.GetAddressOf());\n    d2d->deviceContext->CreateSolidColorBrush(D2D1::ColorF(D2D1::ColorF::White), cropHandleBrush.GetAddressOf());\n    show();\n''',
              '''    d2d->deviceContext->CreateSolidColorBrush(D2D1::ColorF(0x000000, 0.42f), cropShadeBrush.GetAddressOf());\n    d2d->deviceContext->CreateSolidColorBrush(D2D1::ColorF(0x1677ff), cropBorderBrush.GetAddressOf());\n    d2d->deviceContext->CreateSolidColorBrush(D2D1::ColorF(D2D1::ColorF::White), cropHandleBrush.GetAddressOf());\n    if (editorMode) ensureCropRect();\n    show();\n''',
              'initialize crop frame for all editors')
          replace_once(path,
              '''\tif (editorMode && toolMain && toolMain->curId == L"crop") {\n\t\tensureCropRect();\n\t\tauto imgPos = toImgPos(pos);\n\t\tcropHit = hitCrop(imgPos);\n\t\tif (cropHit == CropHit::None) return;\n\t\tcropPress = imgPos;\n\t\tcropStart = cropRect;\n\t\tisMouseDown = true;\n\t\tSetCapture(hwnd);\n\t\treturn;\n\t}\n''',
              '''\tif (editorMode) {\n\t\tensureCropRect();\n\t\tauto imgPos = toImgPos(pos);\n\t\tauto hit = hitCrop(imgPos);\n\t\t// Edges/corners always win over drawing tools. The crop body itself is\n\t\t// movable only when no drawing tool is selected, so drawing inside the\n\t\t// image remains natural while the four sides stay live at all times.\n\t\tconst bool edgeHit = hit != CropHit::None && hit != CropHit::Inside;\n\t\tconst bool bodyMove = hit == CropHit::Inside && toolMain && toolMain->curId.empty();\n\t\tif (edgeHit || bodyMove) {\n\t\t\tcropHit = hit;\n\t\t\tcropPress = imgPos;\n\t\t\tcropStart = cropRect;\n\t\t\tisMouseDown = true;\n\t\t\tSetCapture(hwnd);\n\t\t\treturn;\n\t\t}\n\t}\n''',
              'give crop edges persistent mouse priority')
          replace_once(path,
              '''void WinPin::onMove(POINT pos)\n{\n\tif (editorMode && toolMain && toolMain->curId == L"crop") {\n\t\tif (isMouseDown && cropHit != CropHit::None) updateCrop(toImgPos(pos));\n\t\treturn;\n\t}\n''',
              '''void WinPin::onMove(POINT pos)\n{\n\tif (editorMode && isMouseDown && cropHit != CropHit::None) {\n\t\tupdateCrop(toImgPos(pos));\n\t\treturn;\n\t}\n''',
              'keep crop drag active independent of selected tool')
          replace_once(path,
              '''\tif (editorMode && toolMain && toolMain->curId == L"crop") {\n\t\tif (isMouseDown && cropHit != CropHit::None) updateCrop(toImgPos(pos));\n\t\tisMouseDown = false;\n\t\tcropHit = CropHit::None;\n\t\tif (GetCapture() == hwnd) ReleaseCapture();\n\t\trefresh();\n\t\treturn;\n\t}\n''',
              '''\tif (editorMode && cropHit != CropHit::None) {\n\t\tif (isMouseDown) updateCrop(toImgPos(pos));\n\t\tisMouseDown = false;\n\t\tcropHit = CropHit::None;\n\t\tif (GetCapture() == hwnd) ReleaseCapture();\n\t\trefresh();\n\t\treturn;\n\t}\n''',
              'finish persistent crop drag on mouse up')
          replace_once(path,
              '''\tif (editorMode && toolMain->curId == L"crop") {\n\t\tensureCropRect();\n\t\tPOINT pos{}; GetCursorPos(&pos); ScreenToClient(hwnd, &pos);\n\t\tauto hit = hitCrop(toImgPos(pos));\n\t\tswitch (hit) {\n\t\tcase CropHit::TopLeft: case CropHit::BottomRight: SetCursor(LoadCursor(nullptr, IDC_SIZENWSE)); break;\n\t\tcase CropHit::TopRight: case CropHit::BottomLeft: SetCursor(LoadCursor(nullptr, IDC_SIZENESW)); break;\n\t\tcase CropHit::Top: case CropHit::Bottom: SetCursor(LoadCursor(nullptr, IDC_SIZENS)); break;\n\t\tcase CropHit::Left: case CropHit::Right: SetCursor(LoadCursor(nullptr, IDC_SIZEWE)); break;\n\t\tcase CropHit::Inside: SetCursor(LoadCursor(nullptr, IDC_SIZEALL)); break;\n\t\tdefault: SetCursor(LoadCursor(nullptr, IDC_ARROW)); break;\n\t\t}\n\t\treturn TRUE;\n\t}\n''',
              '''\tif (editorMode) {\n\t\tensureCropRect();\n\t\tPOINT pos{}; GetCursorPos(&pos); ScreenToClient(hwnd, &pos);\n\t\tauto hit = hitCrop(toImgPos(pos));\n\t\tswitch (hit) {\n\t\tcase CropHit::TopLeft: case CropHit::BottomRight: SetCursor(LoadCursor(nullptr, IDC_SIZENWSE)); return TRUE;\n\t\tcase CropHit::TopRight: case CropHit::BottomLeft: SetCursor(LoadCursor(nullptr, IDC_SIZENESW)); return TRUE;\n\t\tcase CropHit::Top: case CropHit::Bottom: SetCursor(LoadCursor(nullptr, IDC_SIZENS)); return TRUE;\n\t\tcase CropHit::Left: case CropHit::Right: SetCursor(LoadCursor(nullptr, IDC_SIZEWE)); return TRUE;\n\t\tcase CropHit::Inside:\n\t\t\tif (toolMain && toolMain->curId.empty()) { SetCursor(LoadCursor(nullptr, IDC_SIZEALL)); return TRUE; }\n\t\t\tbreak;\n\t\tdefault: break;\n\t\t}\n\t}\n''',
              'show crop resize cursors even while annotating')

          # Retire the now-unused localization entry for the removed Crop button.
          path = 'Lang/简体中文.zh-CN.json'
          replace_once(path, '"tool": {"crop":"裁剪",', '"tool": {', 'remove Chinese crop tool label')
          path = 'Lang/English.en-US.json'
          replace_once(path, '"tool": {"crop":"Crop",', '"tool": {', 'remove English crop tool label')

          # Update comments to match the non-modal editor model.
          path = 'Src/Win/WinPin.h'
          replace_once(path,
              '''\t// Long-screenshot editor: fixed canvas + full annotation toolbar + crop tool.\n''',
              '''\t// Long-screenshot editor: fixed canvas + full annotation toolbar + persistent trim frame.\n''',
              'update long editor comment')
          '@ | Set-Content apply_persistent_crop.py -Encoding utf8
          python apply_persistent_crop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare pinned Ling dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lingCommit = 'b77448ec7e72b1b961d3c6f8f87502d8df72aa5f'
          New-Item -ItemType Directory -Force D:\project | Out-Null
          if (Test-Path D:\project\Ling) { Remove-Item -Recurse -Force D:\project\Ling }
          git clone --no-checkout https://github.com/xland/Ling.git D:\project\Ling
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C D:\project\Ling checkout --detach $lingCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $util = Get-Content D:\project\Ling\include\Util.h -Raw
          $util = $util.Replace('constexpr auto gen = [](size_t i, size_t idx) {', 'constexpr auto gen = [](std::wstring_view chars, size_t i, size_t idx) {')
          $util = $util.Replace('std::wstring{gen(I, I)...}', 'std::wstring{gen(chars, I, I)...}')
          Set-Content D:\project\Ling\include\Util.h $util -Encoding utf8
          $lingAppPath = 'D:\project\Ling\src\App.cpp'
          $lingApp = Get-Content $lingAppPath -Raw
          $oldTrayLine = 'tray->hIcon = LoadIcon(GetModuleHandle(nullptr), MAKEINTRESOURCE(1));'
          $newTrayCode = 'tray->hIcon = (HICON)LoadImageW(GetModuleHandle(nullptr), MAKEINTRESOURCE(2), IMAGE_ICON,' + "`r`n" +
            '            GetSystemMetrics(SM_CXSMICON), GetSystemMetrics(SM_CYSMICON), LR_DEFAULTCOLOR);' + "`r`n" +
            '        if (!tray->hIcon) {' + "`r`n" +
            '            tray->hIcon = LoadIcon(GetModuleHandle(nullptr), MAKEINTRESOURCE(1));' + "`r`n" +
            '        }'
          if ($lingApp.Contains($oldTrayLine)) {
            $lingApp = $lingApp.Replace($oldTrayLine, $newTrayCode)
            Set-Content $lingAppPath $lingApp -Encoding utf8
          }

      - name: Build Yoga and Ling
        shell: pwsh
        run: |
          msbuild D:\project\Ling\yoga\yoga.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=D:\project\Ling\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild D:\project\Ling\Ling.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=D:\project\Ling\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build StarCap test executable
        shell: pwsh
        run: |
          msbuild Src\StarCap.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=${{ github.workspace }}\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test executable
        uses: actions/upload-artifact@v4
        with:
          name: StarCap-v0.10.10-persistent-editor-crop-test
          path: x64/Release/StarCap.exe

      - name: Commit verified source and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item apply_persistent_crop.py -Force
          Remove-Item .github/workflows/build-persistent-editor-crop-test.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Tool/ToolMain.cpp Src/Win/WinPin.cpp Src/Win/WinPin.h Lang/简体中文.zh-CN.json Lang/English.en-US.json .github/workflows/build-persistent-editor-crop-test.yml
          git commit -m "Keep crop frame live throughout screenshot annotation"
          git push origin HEAD:fix/long-result-crop-mark
