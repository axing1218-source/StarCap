name: Fix Long Capture Next Layout

on:
  push:
    branches:
      - feature/long-capture-next

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source-level layout type fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Src/Win/CapLong.cpp')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '    int toolW = tool->w;\n': '    int toolW = static_cast<int>(tool->w);\n',
              '    int toolH = tool->h;\n': '    int toolH = static_cast<int>(tool->h);\n    int winW = static_cast<int>(win->w);\n    int winH = static_cast<int>(win->h);\n',
              '    if (rightX + toolW <= win->w) x = rightX;\n': '    if (rightX + toolW <= winW) x = rightX;\n',
              '    else x = std::max(0, std::min(win->w - toolW, static_cast<int>(r.right) - toolW - gap));\n': '    else x = std::max(0, std::min(winW - toolW, static_cast<int>(r.right) - toolW - gap));\n',
              '    y = std::max(0, std::min(win->h - toolH, y));\n': '    y = std::max(0, std::min(winH - toolH, y));\n',
          }
          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
          if changed:
              path.write_text(text, encoding='utf-8')
              print('Updated CapLong.cpp layout dimensions.')
          else:
              print('Layout dimensions already fixed.')
          PY

      - name: Commit fix when needed
        shell: bash
        run: |
          if git diff --quiet -- Src/Win/CapLong.cpp; then
            echo "No source change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Win/CapLong.cpp
          git commit -m "Fix Long Capture Next layout dimensions"
          git push origin HEAD:feature/long-capture-next
