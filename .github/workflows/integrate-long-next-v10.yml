name: Integrate Long Capture Next v10

on:
  push:
    branches:
      - feature/long-capture-next-v10

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        run: python3 tools/patch_long_capture_next_v10.py
      - name: Commit source changes
        run: |
          if git diff --quiet -- Src/Win/CapLong.cpp Src/Win/CutMask.cpp; then
            echo 'No source changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Src/Win/CapLong.cpp Src/Win/CutMask.cpp
          git commit -m 'Add chat seam matcher and Qt fast element path'
          git push origin HEAD:feature/long-capture-next-v10
