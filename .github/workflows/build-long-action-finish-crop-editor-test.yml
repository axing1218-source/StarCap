      - name: Commit verified source and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item apply_action_finish_crop.py -Force
          Remove-Item .github/workflows/build-long-action-finish-crop-editor-test.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Tool/ToolLong.h Src/Tool/ToolLong.cpp Src/Tool/ToolMain.cpp Src/Win/CapLong.cpp Src/Win/WinPin.h Src/Win/WinPin.cpp Lang/简体中文.zh-CN.json Lang/English.en-US.json .github/workflows/build-long-action-finish-crop-editor-test.yml
          git commit -m "Use terminal actions for long capture and add crop to image mark editor"
          git push origin HEAD:fix/long-result-crop-mark
