name: Build long action-finish crop editor test

on:
  push:
    branches:
      - fix/long-result-crop-mark

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout StarCap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final long screenshot interaction
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new, label):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              write(path, text.replace(old, new, 1))
              print('patched', label)

          # Long toolbar: remove the dedicated Done button. Enter/copy/save/mark/etc.
          # are the natural terminal actions; Auto remains pause/resume only.
          path = 'Src/Tool/ToolLong.h'
          replace_once(path,
              '''    std::vector<std::wstring> btnIds = { L"auto",L"done",L"mark",L"ocr",L"translate",L"pin",L"close",L"save",L"clipboard" };\n    std::vector<std::wstring> btnCodes = { L"▶",L"✓",L"\\ue97f",L"\\ue67b",L"译",L"\\ue6a2",L"\\ue62d",L"\\ue608",L"\\ue6ad" };\n    std::vector<std::wstring> btnTips = { L"long.auto",L"long.done",L"cap.mark",L"cap.ocr",L"long.translate",L"tool.pin",L"tool.close",L"tool.save",L"tool.clipboard" };\n''',
              '''    std::vector<std::wstring> btnIds = { L"auto",L"mark",L"ocr",L"translate",L"pin",L"close",L"save",L"clipboard" };\n    std::vector<std::wstring> btnCodes = { L"▶",L"\\ue97f",L"\\ue67b",L"译",L"\\ue6a2",L"\\ue62d",L"\\ue608",L"\\ue6ad" };\n    std::vector<std::wstring> btnTips = { L"long.auto",L"cap.mark",L"cap.ocr",L"long.translate",L"tool.pin",L"tool.close",L"tool.save",L"tool.clipboard" };\n''',
              'remove long Done button')

          path = 'Src/Tool/ToolLong.cpp'
          replace_once(path,
              '''        if (btnIds[i] == L"auto" || btnIds[i] == L"translate" || btnIds[i] == L"done") {\n''',
              '''        if (btnIds[i] == L"auto" || btnIds[i] == L"translate") {\n''',
              'remove Done font special case')
          replace_once(path,
              '''    if (btn->id == L"done") {\n        if (capLong) capLong->enterResultAdjust();\n        return;\n    }\n''',
              '''''',
              'remove Done click action')

          # Long capture: pausing Auto must keep manual capture alive, terminal auto
          # no-progress pauses rather than finalizes, and stopCap only freezes the result.
          path = 'Src/Win/CapLong.cpp'
          replace_once(path,
              '''void CapLong::pauseAuto(const wchar_t* reason, bool hardPause)\n{\n    // Exhausting all scroll strategies is the automatic equivalent of reaching\n    // the end: finalize and expose the completed result for direct trimming.\n    if (!hardPause && reason &&\n        (wcscmp(reason, L"no-progress") == 0 || wcscmp(reason, L"scroll-driver-unavailable") == 0)) {\n        stopCap(false);\n        return;\n    }\n    if (!autoScroll && !hardPaused) return;\n''',
              '''void CapLong::pauseAuto(const wchar_t* reason, bool hardPause)\n{\n    // Auto-scroll is only an aid. Even when it cannot advance further, keep the\n    // stitched session alive so the user can scroll manually, resume Auto, press\n    // Enter to copy, or choose a terminal toolbar action.\n    if (!autoScroll && !hardPaused) return;\n''',
              'do not finalize on Auto no-progress')
          replace_once(path,
              '''    // Auto-scroll is only a capture aid. Toggling it pauses/resumes automatic\n    // scrolling; the separate Done action finalizes the long screenshot.\n    if (autoScroll) pauseAuto(L"user-pause", true);\n    else startAutoScroll();\n''',
              '''    // Auto-scroll is only a capture aid. Pausing it leaves frame capture\n    // running so manual wheel scrolling can continue the same stitched session.\n    if (autoScroll) pauseAuto(L"user-pause", false);\n    else startAutoScroll();\n''',
              'Auto pause keeps manual capture active')
          replace_once(path,
              '''    win->restoreWin();\n    // Once a long screenshot is complete, immediately show the stitched image\n    // with the familiar eight resize handles. Manual and automatic scrolling\n    // share the same Done -> adjust -> mark/save/copy result flow.\n    enterResultAdjust();\n    win->refresh();\n''',
              '''    win->restoreWin();\n    // No standalone "Done" stage: the action that ends capture (Enter/copy,\n    // mark, save, OCR, translate or pin) decides what happens next.\n    win->refresh();\n''',
              'remove automatic post-stop crop stage')
          replace_once(path,
              '''    WinPin::initEditorFromData(posX, posY, imgW, resultH, imgData);\n''',
              '''    WinPin::initLongEditorFromData(posX, posY, imgW, resultH, imgData);\n''',
              'open crop-capable long image editor')

          # ToolMain: Image Mark editors get a Crop tool. Normal desktop pins and
          # OCR movable annotation windows keep their existing toolbar unchanged.
          path = 'Src/Tool/ToolMain.cpp'
          replace_once(path,
              '''\ty = win->y + win->h + 5.f * win->dpi;\n\trefreshSize();\n''',
              '''\ty = win->y + win->h + 5.f * win->dpi;\n\tif (win && win->editorMode) {\n\t\tbtnIds.insert(btnIds.begin(), L"crop");\n\t\tbtnCodes.insert(btnCodes.begin(), L"裁");\n\t}\n\trefreshSize();\n''',
              'add Crop button in fixed image editors')
          replace_once(path,
              '''\t\t\tif (id == L"rotate" || id == L"mirror") {\n''',
              '''\t\t\tif (id == L"crop") {\n\t\t\t\tbtn->setFontFamily(L"Microsoft YaHei");\n\t\t\t\tbtn->setFontSize(12.f);\n\t\t\t}\n\t\t\telse if (id == L"rotate" || id == L"mirror") {\n''',
              'style Crop button')
          replace_once(path,
              '''\telse if (btn->id == L"rotate") { StarCapPinTransform::rotateClockwise(win); return; }\n\telse if (btn->id == L"mirror") { StarCapPinTransform::mirrorHorizontal(win); return; }\n''',
              '''\telse if (btn->id == L"rotate") { StarCapPinTransform::rotateClockwise(win); win->resetCrop(); return; }\n\telse if (btn->id == L"mirror") { StarCapPinTransform::mirrorHorizontal(win); win->resetCrop(); return; }\n''',
              'reset crop after transforms')
          replace_once(path,
              '''\tcurId = btn->id;\n\tif (curId == L"rect") win->toolSub->showRectTools();\n''',
              '''\tcurId = btn->id;\n\tif (curId == L"crop") {\n\t\twin->ensureCropRect();\n\t\twin->toolSub->hideTools();\n\t}\n\telse if (curId == L"rect") win->toolSub->showRectTools();\n''',
              'activate Crop mode')

          # WinPin declarations for crop-capable fixed editors.
          path = 'Src/Win/WinPin.h'
          replace_once(path,
              '''\tstatic void initEditorFromData(int x, int y, int w, int h, std::vector<BYTE>& data);\n''',
              '''\tstatic void initEditorFromData(int x, int y, int w, int h, std::vector<BYTE>& data);\n\t// Long-screenshot editor: fixed canvas + full annotation toolbar + crop tool.\n\tstatic void initLongEditorFromData(int x, int y, int w, int h, std::vector<BYTE>& data);\n''',
              'declare long crop editor')
          replace_once(path,
              '''private:\n\tWinPin(int x, int y, int w, int h, const std::vector<BYTE>* data = nullptr, bool editorMode = false);\n''',
              '''private:\n\tenum class CropHit { None, Inside, Left, Right, Top, Bottom, TopLeft, TopRight, BottomLeft, BottomRight };\n\tWinPin(int x, int y, int w, int h, const std::vector<BYTE>* data = nullptr, bool editorMode = false);\n''',
              'declare CropHit')
          replace_once(path,
              '''\tvoid paintScaleTip(ID2D1DeviceContext* ctx);\n''',
              '''\tvoid paintScaleTip(ID2D1DeviceContext* ctx);\n\tvoid ensureCropRect();\n\tvoid resetCrop();\n\tCropHit hitCrop(POINT imgPos) const;\n\tvoid updateCrop(POINT imgPos);\n\tvoid paintCrop(ID2D1DeviceContext* ctx);\n''',
              'declare crop helpers')
          replace_once(path,
              '''\tbool editorMode{ false };\n\t// onDpiChanged 与 onSizeChanged 之间的接力标记，见构造函数里的注释\n''',
              '''\tbool editorMode{ false };\n\tbool cropInitialized{ false };\n\tCropHit cropHit{ CropHit::None };\n\tD2D1_RECT_F cropRect{};\n\tD2D1_RECT_F cropStart{};\n\tPOINT cropPress{ 0,0 };\n\tMicrosoft::WRL::ComPtr<ID2D1SolidColorBrush> cropShadeBrush, cropBorderBrush, cropHandleBrush;\n\t// onDpiChanged 与 onSizeChanged 之间的接力标记，见构造函数里的注释\n''',
              'add crop state')

          # WinPin crop implementation.
          path = 'Src/Win/WinPin.cpp'
          replace_once(path,
              '''void WinPin::initFromData(int x, int y, int w, int h, std::vector<BYTE>& data)\n''',
              '''void WinPin::initLongEditorFromData(int x, int y, int w, int h, std::vector<BYTE>& data)\n{\n    ToolMain::queueEditorOpen();\n    auto ptr = new WinPin(x, y, w, h, &data, true);\n    std::unique_ptr<WinPin> winPin{ ptr };\n    ptr->createNativeWindow(WS_EX_TOPMOST | WS_EX_TOOLWINDOW, WS_POPUP);\n\n    RECT sourceRect{ x, y, x + w, y + h };\n    MONITORINFO mi{ sizeof(MONITORINFO) };\n    HMONITOR mon = MonitorFromRect(&sourceRect, MONITOR_DEFAULTTONEAREST);\n    if (mon && GetMonitorInfo(mon, &mi)) {\n        const int workW = mi.rcWork.right - mi.rcWork.left;\n        const int workH = mi.rcWork.bottom - mi.rcWork.top;\n        const float fit = std::min(1.f, std::min(\n            (workW * 0.82f) / std::max(1, w),\n            (workH * 0.78f) / std::max(1, h)));\n        if (fit < 0.999f) {\n            ptr->scale = std::max(0.1f, fit);\n            ptr->applyWinSize();\n            const int drawW = static_cast<int>(std::lround(w * ptr->scale));\n            const int drawH = static_cast<int>(std::lround(h * ptr->scale));\n            ptr->setPosition(mi.rcWork.left + (workW - drawW) / 2,\n                mi.rcWork.top + (workH - drawH) / 2);\n            ptr->layoutTools();\n            ptr->refresh();\n        }\n    }\n    winPins.push_back(std::move(winPin));\n}\n\nvoid WinPin::initFromData(int x, int y, int w, int h, std::vector<BYTE>& data)\n''',
              'implement long crop editor')
          replace_once(path,
              '''    d2d->deviceContext->CreateSolidColorBrush(D2D1::ColorF(0x000000, 0.46f), brushTipBg.GetAddressOf());\n    d2d->deviceContext->CreateSolidColorBrush(D2D1::ColorF(D2D1::ColorF::White), brushTipText.GetAddressOf());\n''',
              '''    d2d->deviceContext->CreateSolidColorBrush(D2D1::ColorF(0x000000, 0.46f), brushTipBg.GetAddressOf());\n    d2d->deviceContext->CreateSolidColorBrush(D2D1::ColorF(D2D1::ColorF::White), brushTipText.GetAddressOf());\n    d2d->deviceContext->CreateSolidColorBrush(D2D1::ColorF(0x000000, 0.42f), cropShadeBrush.GetAddressOf());\n    d2d->deviceContext->CreateSolidColorBrush(D2D1::ColorF(0x1677ff), cropBorderBrush.GetAddressOf());\n    d2d->deviceContext->CreateSolidColorBrush(D2D1::ColorF(D2D1::ColorF::White), cropHandleBrush.GetAddressOf());\n''',
              'create crop brushes')
          replace_once(path,
              '''\tctx->SetTransform(D2D1::Matrix3x2F::Identity());\n\tctx->DrawRectangle(D2D1::RectF(0.f, 0.f, w, h), borderBrush.Get(), 2*dpi);\n''',
              '''\tctx->SetTransform(D2D1::Matrix3x2F::Identity());\n\tpaintCrop(ctx);\n\tctx->DrawRectangle(D2D1::RectF(0.f, 0.f, w, h), borderBrush.Get(), 2*dpi);\n''',
              'paint crop overlay')
          replace_once(path,
              '''POINT WinPin::toImgPos(const POINT& pos) const\n{\n\tif (scale == 1.f) return pos;\n\treturn POINT{ static_cast<LONG>(std::lround(pos.x / scale)), static_cast<LONG>(std::lround(pos.y / scale)) };\n}\n\nvoid WinPin::applyScale(float newScale, POINT anchor)\n''',
              '''POINT WinPin::toImgPos(const POINT& pos) const\n{\n\tif (scale == 1.f) return pos;\n\treturn POINT{ static_cast<LONG>(std::lround(pos.x / scale)), static_cast<LONG>(std::lround(pos.y / scale)) };\n}\n\nvoid WinPin::ensureCropRect()\n{\n\tif (cropInitialized) return;\n\tresetCrop();\n}\n\nvoid WinPin::resetCrop()\n{\n\tauto sz = getImgSize();\n\tif (sz.width == 0 || sz.height == 0) return;\n\tcropRect = D2D1::RectF(0.f, 0.f, static_cast<float>(sz.width), static_cast<float>(sz.height));\n\tcropStart = cropRect;\n\tcropInitialized = true;\n\tcropHit = CropHit::None;\n\trefresh();\n}\n\nWinPin::CropHit WinPin::hitCrop(POINT p) const\n{\n\tif (!cropInitialized) return CropHit::None;\n\tconst float tol = std::max(4.f, 8.f / std::max(0.1f, scale));\n\tconst bool l = std::abs(p.x - cropRect.left) <= tol;\n\tconst bool r = std::abs(p.x - cropRect.right) <= tol;\n\tconst bool t = std::abs(p.y - cropRect.top) <= tol;\n\tconst bool b = std::abs(p.y - cropRect.bottom) <= tol;\n\tconst bool inX = p.x >= cropRect.left - tol && p.x <= cropRect.right + tol;\n\tconst bool inY = p.y >= cropRect.top - tol && p.y <= cropRect.bottom + tol;\n\tif (l && t) return CropHit::TopLeft;\n\tif (r && t) return CropHit::TopRight;\n\tif (l && b) return CropHit::BottomLeft;\n\tif (r && b) return CropHit::BottomRight;\n\tif (l && inY) return CropHit::Left;\n\tif (r && inY) return CropHit::Right;\n\tif (t && inX) return CropHit::Top;\n\tif (b && inX) return CropHit::Bottom;\n\tif (p.x > cropRect.left && p.x < cropRect.right && p.y > cropRect.top && p.y < cropRect.bottom) return CropHit::Inside;\n\treturn CropHit::None;\n}\n\nvoid WinPin::updateCrop(POINT p)\n{\n\tif (!cropInitialized || cropHit == CropHit::None) return;\n\tauto sz = getImgSize();\n\tconst float maxX = static_cast<float>(sz.width);\n\tconst float maxY = static_cast<float>(sz.height);\n\tconst float minSize = 8.f;\n\tconst float dx = static_cast<float>(p.x - cropPress.x);\n\tconst float dy = static_cast<float>(p.y - cropPress.y);\n\tauto r = cropStart;\n\n\tif (cropHit == CropHit::Inside) {\n\t\tconst float rw = r.right - r.left, rh = r.bottom - r.top;\n\t\tfloat nl = std::clamp(r.left + dx, 0.f, std::max(0.f, maxX - rw));\n\t\tfloat nt = std::clamp(r.top + dy, 0.f, std::max(0.f, maxY - rh));\n\t\tcropRect = D2D1::RectF(nl, nt, nl + rw, nt + rh);\n\t\trefresh();\n\t\treturn;\n\t}\n\n\tif (cropHit == CropHit::Left || cropHit == CropHit::TopLeft || cropHit == CropHit::BottomLeft)\n\t\tr.left = std::clamp(r.left + dx, 0.f, r.right - minSize);\n\tif (cropHit == CropHit::Right || cropHit == CropHit::TopRight || cropHit == CropHit::BottomRight)\n\t\tr.right = std::clamp(r.right + dx, r.left + minSize, maxX);\n\tif (cropHit == CropHit::Top || cropHit == CropHit::TopLeft || cropHit == CropHit::TopRight)\n\t\tr.top = std::clamp(r.top + dy, 0.f, r.bottom - minSize);\n\tif (cropHit == CropHit::Bottom || cropHit == CropHit::BottomLeft || cropHit == CropHit::BottomRight)\n\t\tr.bottom = std::clamp(r.bottom + dy, r.top + minSize, maxY);\n\tcropRect = r;\n\trefresh();\n}\n\nvoid WinPin::paintCrop(ID2D1DeviceContext* ctx)\n{\n\tif (!editorMode || !toolMain || toolMain->curId != L"crop" || !cropInitialized || !cropShadeBrush || !cropBorderBrush) return;\n\tD2D1_RECT_F r{ cropRect.left * scale, cropRect.top * scale, cropRect.right * scale, cropRect.bottom * scale };\n\tr.left = std::clamp(r.left, 0.f, w); r.right = std::clamp(r.right, 0.f, w);\n\tr.top = std::clamp(r.top, 0.f, h); r.bottom = std::clamp(r.bottom, 0.f, h);\n\tctx->FillRectangle(D2D1::RectF(0.f, 0.f, w, r.top), cropShadeBrush.Get());\n\tctx->FillRectangle(D2D1::RectF(0.f, r.bottom, w, h), cropShadeBrush.Get());\n\tctx->FillRectangle(D2D1::RectF(0.f, r.top, r.left, r.bottom), cropShadeBrush.Get());\n\tctx->FillRectangle(D2D1::RectF(r.right, r.top, w, r.bottom), cropShadeBrush.Get());\n\tctx->DrawRectangle(r, cropBorderBrush.Get(), std::max(1.f, 1.5f * dpi));\n\n\tconst float hs = std::max(3.f, 4.f * dpi);\n\tconst D2D1_POINT_2F pts[] = {\n\t\t{r.left,r.top},{(r.left+r.right)*.5f,r.top},{r.right,r.top},\n\t\t{r.left,(r.top+r.bottom)*.5f},{r.right,(r.top+r.bottom)*.5f},\n\t\t{r.left,r.bottom},{(r.left+r.right)*.5f,r.bottom},{r.right,r.bottom}\n\t};\n\tfor (auto pnt : pts) {\n\t\tauto box = D2D1::RectF(pnt.x-hs, pnt.y-hs, pnt.x+hs, pnt.y+hs);\n\t\tctx->FillRectangle(box, cropHandleBrush.Get());\n\t\tctx->DrawRectangle(box, cropBorderBrush.Get(), 1.f);\n\t}\n}\n\nvoid WinPin::applyScale(float newScale, POINT anchor)\n''',
              'implement crop helpers')
          replace_once(path,
              '''\tif (isRight) return;\n\n\t// 双击判定得自己做''',
              '''\tif (isRight) return;\n\n\tif (editorMode && toolMain && toolMain->curId == L"crop") {\n\t\tensureCropRect();\n\t\tauto imgPos = toImgPos(pos);\n\t\tcropHit = hitCrop(imgPos);\n\t\tif (cropHit == CropHit::None) return;\n\t\tcropPress = imgPos;\n\t\tcropStart = cropRect;\n\t\tisMouseDown = true;\n\t\tSetCapture(hwnd);\n\t\treturn;\n\t}\n\n\t// 双击判定得自己做''',
              'crop mouse down')
          replace_once(path,
              '''void WinPin::onMove(POINT pos)\n{\n\t// 同 onDown：文本框里的移动归 TextBox''',
              '''void WinPin::onMove(POINT pos)\n{\n\tif (editorMode && toolMain && toolMain->curId == L"crop") {\n\t\tif (isMouseDown && cropHit != CropHit::None) updateCrop(toImgPos(pos));\n\t\treturn;\n\t}\n\t// 同 onDown：文本框里的移动归 TextBox''',
              'crop mouse move')
          replace_once(path,
              '''\tif (isRight) {\n\t\t// The pinned image owns its context-menu gesture.''',
              '''\tif (isRight) {\n\t\t// The pinned image owns its context-menu gesture.''',
              'anchor onUp right block')
          # Insert crop-up handling immediately after the right-click block.
          text = read(path)
          marker = '''\t\tif (toolMain) toolMain->showPinContextMenu();\n\t\treturn;\n\t}\n\tisMouseDown = false;\n'''
          repl = '''\t\tif (toolMain) toolMain->showPinContextMenu();\n\t\treturn;\n\t}\n\tif (editorMode && toolMain && toolMain->curId == L"crop") {\n\t\tif (isMouseDown && cropHit != CropHit::None) updateCrop(toImgPos(pos));\n\t\tisMouseDown = false;\n\t\tcropHit = CropHit::None;\n\t\tif (GetCapture() == hwnd) ReleaseCapture();\n\t\trefresh();\n\t\treturn;\n\t}\n\tisMouseDown = false;\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'crop mouse up: expected one match, got {text.count(marker)}')
          write(path, text.replace(marker, repl, 1))
          print('patched crop mouse up')

          replace_once(path,
              '''\tcpuBmp->Unmap();\n\treturn true;\n}\n\nBOOL WinPin::setCursor()\n''',
              '''\tcpuBmp->Unmap();\n\n\tif (cropInitialized) {\n\t\tint left = std::clamp(static_cast<int>(std::floor(cropRect.left)), 0, static_cast<int>(size.width) - 1);\n\t\tint top = std::clamp(static_cast<int>(std::floor(cropRect.top)), 0, static_cast<int>(size.height) - 1);\n\t\tint right = std::clamp(static_cast<int>(std::ceil(cropRect.right)), left + 1, static_cast<int>(size.width));\n\t\tint bottom = std::clamp(static_cast<int>(std::ceil(cropRect.bottom)), top + 1, static_cast<int>(size.height));\n\t\tif (left != 0 || top != 0 || right != static_cast<int>(size.width) || bottom != static_cast<int>(size.height)) {\n\t\t\tconst UINT32 outW = static_cast<UINT32>(right - left);\n\t\t\tconst UINT32 outH = static_cast<UINT32>(bottom - top);\n\t\t\tstd::vector<BYTE> cropped(static_cast<size_t>(outW) * outH * 4);\n\t\t\tfor (UINT32 row = 0; row < outH; ++row) {\n\t\t\t\tconst BYTE* src = pixels.data() + (static_cast<size_t>(top) + row) * rowBytes + static_cast<size_t>(left) * 4;\n\t\t\t\tCopyMemory(cropped.data() + static_cast<size_t>(row) * outW * 4, src, static_cast<size_t>(outW) * 4);\n\t\t\t}\n\t\t\tpixels = std::move(cropped);\n\t\t\tsize = D2D1::SizeU(outW, outH);\n\t\t}\n\t}\n\treturn true;\n}\n\nBOOL WinPin::setCursor()\n''',
              'crop composed output')
          replace_once(path,
              '''\tif (toolMain->curId == L"") {\n\t\tSetCursor(LoadCursor(nullptr, editorMode ? IDC_ARROW : IDC_SIZEALL));\n\t\treturn TRUE;\n\t}\n''',
              '''\tif (editorMode && toolMain->curId == L"crop") {\n\t\tensureCropRect();\n\t\tPOINT pos{}; GetCursorPos(&pos); ScreenToClient(hwnd, &pos);\n\t\tauto hit = hitCrop(toImgPos(pos));\n\t\tswitch (hit) {\n\t\tcase CropHit::TopLeft: case CropHit::BottomRight: SetCursor(LoadCursor(nullptr, IDC_SIZENWSE)); break;\n\t\tcase CropHit::TopRight: case CropHit::BottomLeft: SetCursor(LoadCursor(nullptr, IDC_SIZENESW)); break;\n\t\tcase CropHit::Top: case CropHit::Bottom: SetCursor(LoadCursor(nullptr, IDC_SIZENS)); break;\n\t\tcase CropHit::Left: case CropHit::Right: SetCursor(LoadCursor(nullptr, IDC_SIZEWE)); break;\n\t\tcase CropHit::Inside: SetCursor(LoadCursor(nullptr, IDC_SIZEALL)); break;\n\t\tdefault: SetCursor(LoadCursor(nullptr, IDC_ARROW)); break;\n\t\t}\n\t\treturn TRUE;\n\t}\n\tif (toolMain->curId == L"") {\n\t\tSetCursor(LoadCursor(nullptr, editorMode ? IDC_ARROW : IDC_SIZEALL));\n\t\treturn TRUE;\n\t}\n''',
              'crop cursor')

          # Localized labels.
          path = 'Lang/简体中文.zh-CN.json'
          text = read(path)
          text = text.replace('''"tool": {"rect":"矩形"''', '''"tool": {"crop":"裁剪","rect":"矩形"''', 1)
          text = text.replace('''"long": {"start":"开始","auto":"自动滚动","done":"完成长截图","translate":"翻译"''', '''"long": {"start":"开始","auto":"自动滚动 / 暂停","translate":"翻译"''', 1)
          write(path, text)

          path = 'Lang/English.en-US.json'
          text = read(path)
          text = text.replace('''"tool": {"rect":"Rectangle"''', '''"tool": {"crop":"Crop","rect":"Rectangle"''', 1)
          text = text.replace('''"long": {"start":"Start","auto":"Auto Scroll","done":"Finish Scrolling Screenshot","translate":"Translate"''', '''"long": {"start":"Start","auto":"Auto Scroll / Pause","translate":"Translate"''', 1)
          write(path, text)
          '@ | Set-Content apply_action_finish_crop.py -Encoding utf8
          python apply_action_finish_crop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare pinned Ling dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lingCommit = 'b77448ec7e72b1b961d3c6f8f87502d8df72aa5f'
          New-Item -ItemType Directory -Force D:\project | Out-Null
          if (Test-Path D:\project\Ling) { Remove-Item -Recurse -Force D:\project\Ling }
          git clone --no-checkout https://github.com/xland/Ling.git D:\project\Ling
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C D:\project\Ling checkout --detach $lingCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $util = Get-Content D:\project\Ling\include\Util.h -Raw
          $util = $util.Replace('constexpr auto gen = [](size_t i, size_t idx) {', 'constexpr auto gen = [](std::wstring_view chars, size_t i, size_t idx) {')
          $util = $util.Replace('std::wstring{gen(I, I)...}', 'std::wstring{gen(chars, I, I)...}')
          Set-Content D:\project\Ling\include\Util.h $util -Encoding utf8
          $lingAppPath = 'D:\project\Ling\src\App.cpp'
          $lingApp = Get-Content $lingAppPath -Raw
          $oldTrayLine = 'tray->hIcon = LoadIcon(GetModuleHandle(nullptr), MAKEINTRESOURCE(1));'
          $newTrayCode = 'tray->hIcon = (HICON)LoadImageW(GetModuleHandle(nullptr), MAKEINTRESOURCE(2), IMAGE_ICON,' + "`r`n" +
            '            GetSystemMetrics(SM_CXSMICON), GetSystemMetrics(SM_CYSMICON), LR_DEFAULTCOLOR);' + "`r`n" +
            '        if (!tray->hIcon) {' + "`r`n" +
            '            tray->hIcon = LoadIcon(GetModuleHandle(nullptr), MAKEINTRESOURCE(1));' + "`r`n" +
            '        }'
          if ($lingApp.Contains($oldTrayLine)) {
            $lingApp = $lingApp.Replace($oldTrayLine, $newTrayCode)
            Set-Content $lingAppPath $lingApp -Encoding utf8
          }

      - name: Build Yoga and Ling
        shell: pwsh
        run: |
          msbuild D:\project\Ling\yoga\yoga.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=D:\project\Ling\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild D:\project\Ling\Ling.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=D:\project\Ling\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build StarCap test executable
        shell: pwsh
        run: |
          msbuild Src\StarCap.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=${{ github.workspace }}\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

