name: Build long WeChat-style flow test

on:
  push:
    branches:
      - fix/long-result-crop-mark

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout StarCap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final long screenshot UX
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new, label):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              write(path, text.replace(old, new, 1))
              print('patched', label)

          # Toolbar semantics: manual or automatic scrolling are capture methods;
          # finishing is a separate action, like WeChat's scrolling screenshot flow.
          path = 'Src/Tool/ToolLong.h'
          replace_once(path,
              '''    std::vector<std::wstring> btnIds = { L"auto",L"crop",L"mark",L"ocr",L"translate",L"pin",L"close",L"save",L"clipboard" };\n    std::vector<std::wstring> btnCodes = { L"▶",L"裁",L"\\ue97f",L"\\ue67b",L"译",L"\\ue6a2",L"\\ue62d",L"\\ue608",L"\\ue6ad" };\n    std::vector<std::wstring> btnTips = { L"long.auto",L"long.adjust",L"cap.mark",L"cap.ocr",L"long.translate",L"tool.pin",L"tool.close",L"tool.save",L"tool.clipboard" };\n''',
              '''    std::vector<std::wstring> btnIds = { L"auto",L"done",L"mark",L"ocr",L"translate",L"pin",L"close",L"save",L"clipboard" };\n    std::vector<std::wstring> btnCodes = { L"▶",L"✓",L"\\ue97f",L"\\ue67b",L"译",L"\\ue6a2",L"\\ue62d",L"\\ue608",L"\\ue6ad" };\n    std::vector<std::wstring> btnTips = { L"long.auto",L"long.done",L"cap.mark",L"cap.ocr",L"long.translate",L"tool.pin",L"tool.close",L"tool.save",L"tool.clipboard" };\n''',
              'ToolLong done button')

          path = 'Src/Tool/ToolLong.cpp'
          replace_once(path,
              '''        if (btnIds[i] == L"auto" || btnIds[i] == L"translate" || btnIds[i] == L"crop") {\n''',
              '''        if (btnIds[i] == L"auto" || btnIds[i] == L"translate" || btnIds[i] == L"done") {\n''',
              'ToolLong done font')
          replace_once(path,
              '''    if (btn->id == L"crop") {\n        if (capLong) capLong->enterResultAdjust();\n        return;\n    }\n''',
              '''    if (btn->id == L"done") {\n        if (capLong) capLong->enterResultAdjust();\n        return;\n    }\n''',
              'ToolLong done click')

          path = 'Src/Win/CapLong.cpp'
          replace_once(path,
              '''void CapLong::toggleAutoScroll()\n{\n    if (!isCapturing || isFinish) return;\n    // A second click means the user is done capturing. Finish the stitched result\n    // and immediately expose resize handles, matching the normal screenshot flow.\n    if (autoScroll) stopCap(false);\n    else startAutoScroll();\n}\n''',
              '''void CapLong::toggleAutoScroll()\n{\n    if (!isCapturing || isFinish) return;\n    // Auto-scroll is only a capture aid. Toggling it pauses/resumes automatic\n    // scrolling; the separate Done action finalizes the long screenshot.\n    if (autoScroll) pauseAuto(L"user-pause", true);\n    else startAutoScroll();\n}\n''',
              'Separate auto-scroll from finishing')
          replace_once(path,
              '''    // Once a long screenshot is complete, immediately show the stitched image\n    // with the familiar eight resize handles. The existing Crop button remains\n    // as a manual-finish fallback for manual-scroll workflows.\n''',
              '''    // Once a long screenshot is complete, immediately show the stitched image\n    // with the familiar eight resize handles. Manual and automatic scrolling\n    // share the same Done -> adjust -> mark/save/copy result flow.\n''',
              'Final-flow comment')

          path = 'Lang/简体中文.zh-CN.json'
          replace_once(path,
              '''  "long": {"start":"开始","auto":"开始 / 完成长截图","adjust":"调整截图范围","translate":"翻译","reachedBottom":"已触底，截图停止","tooLong":"图像过长，截图停止"},''',
              '''  "long": {"start":"开始","auto":"自动滚动","done":"完成长截图","translate":"翻译","reachedBottom":"已触底，截图停止","tooLong":"图像过长，截图停止"},''',
              'Chinese final long tooltips')
          path = 'Lang/English.en-US.json'
          replace_once(path,
              '''  "long": {"start":"Start","auto":"Start / Finish Scrolling Screenshot","adjust":"Adjust Capture Area","translate":"Translate","reachedBottom":"Reached the bottom, capture stopped","tooLong":"Image too long, capture stopped"},''',
              '''  "long": {"start":"Start","auto":"Auto Scroll","done":"Finish Scrolling Screenshot","translate":"Translate","reachedBottom":"Reached the bottom, capture stopped","tooLong":"Image too long, capture stopped"},''',
              'English final long tooltips')
          '@ | Set-Content apply_long_final_flow.py -Encoding utf8
          python apply_long_final_flow.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare pinned Ling dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lingCommit = 'b77448ec7e72b1b961d3c6f8f87502d8df72aa5f'
          New-Item -ItemType Directory -Force D:\project | Out-Null
          if (Test-Path D:\project\Ling) { Remove-Item -Recurse -Force D:\project\Ling }
          git clone --no-checkout https://github.com/xland/Ling.git D:\project\Ling
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C D:\project\Ling checkout --detach $lingCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $util = Get-Content D:\project\Ling\include\Util.h -Raw
          $util = $util.Replace('constexpr auto gen = [](size_t i, size_t idx) {', 'constexpr auto gen = [](std::wstring_view chars, size_t i, size_t idx) {')
          $util = $util.Replace('std::wstring{gen(I, I)...}', 'std::wstring{gen(chars, I, I)...}')
          Set-Content D:\project\Ling\include\Util.h $util -Encoding utf8
          $lingAppPath = 'D:\project\Ling\src\App.cpp'
          $lingApp = Get-Content $lingAppPath -Raw
          $oldTrayLine = 'tray->hIcon = LoadIcon(GetModuleHandle(nullptr), MAKEINTRESOURCE(1));'
          $newTrayCode = 'tray->hIcon = (HICON)LoadImageW(GetModuleHandle(nullptr), MAKEINTRESOURCE(2), IMAGE_ICON,' + "`r`n" +
            '            GetSystemMetrics(SM_CXSMICON), GetSystemMetrics(SM_CYSMICON), LR_DEFAULTCOLOR);' + "`r`n" +
            '        if (!tray->hIcon) {' + "`r`n" +
            '            tray->hIcon = LoadIcon(GetModuleHandle(nullptr), MAKEINTRESOURCE(1));' + "`r`n" +
            '        }'
          if ($lingApp.Contains($oldTrayLine)) {
            $lingApp = $lingApp.Replace($oldTrayLine, $newTrayCode)
            Set-Content $lingAppPath $lingApp -Encoding utf8
          }

      - name: Build Yoga and Ling
        shell: pwsh
        run: |
          msbuild D:\project\Ling\yoga\yoga.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=D:\project\Ling\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild D:\project\Ling\Ling.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=D:\project\Ling\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build StarCap test executable
        shell: pwsh
        run: |
          msbuild Src\StarCap.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=${{ github.workspace }}\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test executable
        uses: actions/upload-artifact@v4
        with:
          name: StarCap-v0.10.10-long-wechat-flow-test
          path: x64/Release/StarCap.exe

      - name: Commit verified source and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item apply_long_final_flow.py -Force
          Remove-Item .github/workflows/build-long-wechat-flow-test.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Tool/ToolLong.h Src/Tool/ToolLong.cpp Src/Win/CapLong.cpp Lang/简体中文.zh-CN.json Lang/English.en-US.json .github/workflows/build-long-wechat-flow-test.yml
          git commit -m "Align long screenshot flow with manual finish plus auto scroll"
          git push origin HEAD:fix/long-result-crop-mark
