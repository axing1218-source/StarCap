name: Build draggable annotation editor test

on:
  push:
    branches:
      - fix/long-result-crop-mark

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout StarCap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply draggable editor UX
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('Src/Win/WinPin.cpp')
          text = path.read_text(encoding='utf-8-sig')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              text = text.replace(old, new, 1)
              print('patched', label)

          replace_once(
          '''\t\t// Edges/corners always win over drawing tools. The crop body itself is\n\t\t// movable only when no drawing tool is selected, so drawing inside the\n\t\t// image remains natural while the four sides stay live at all times.\n\t\tconst bool edgeHit = hit != CropHit::None && hit != CropHit::Inside;\n\t\tconst bool bodyMove = hit == CropHit::Inside && toolMain && toolMain->curId.empty();\n\t\tif (edgeHit || bodyMove) {\n''',
          '''\t\t// Edges/corners always resize the current capture, even while an\n\t\t// annotation tool is active. The interior stays free for normal window\n\t\t// dragging whenever no drawing tool is selected.\n\t\tconst bool edgeHit = hit != CropHit::None && hit != CropHit::Inside;\n\t\tif (edgeHit) {\n''',
          'reserve crop handling for edges and corners')

          replace_once(
          '''\t// Editor mode is intentionally not a desktop pin. With no drawing tool\n\t// selected, a left press simply leaves the captured canvas fixed in place.\n\tif (editorMode && toolMain->curId == L"") return;\n''',
          '''\t// With no annotation tool selected, editor mode behaves like Snipaste:\n\t// drag inside the image to move the whole editor window. Selecting a drawing\n\t// tool temporarily gives normal interior drags to that tool, while the crop\n\t// edges/corners above remain adjustable at all times.\n''',
          'allow editor window dragging when no tool is selected')

          replace_once(
          '''\tif (toolMain->curId == L"") { // plain pin: no tool means drag the pinned window\n\t\t// Do not hide ToolMain here. A normal pin starts with its toolbar hidden,\n\t\t// but once the user explicitly enables it from the context menu it must\n\t\t// remain visible and follow the pin while the window is moved. Hiding the\n\t\t// native toolbar without changing pinToolbarVisible left the menu checked\n\t\t// while the window itself was invisible, forcing an off/on toggle to recover.\n\t\treturn;\n\t}\n''',
          '''\tif (toolMain->curId == L"") { // no tool: drag pin/editor window\n\t\t// Keep the toolbar visible while editor mode is moved. Normal pins may\n\t\t// still have their toolbar hidden, but the same drag path applies to both.\n\t\treturn;\n\t}\n''',
          'document shared editor drag path')

          replace_once(
          '''\tif (toolMain->curId == L"") {\n\t\t// Plain pin: a click/drag must never summon the editor toolbar.\n\t\t// ToolMain owns the desired visibility state and restores it after a drag\n\t\t// only when the user explicitly entered editor mode / enabled it from the menu.\n\t\tlayoutTools();\n\t}\n''',
          '''\tif (toolMain->curId == L"") {\n\t\t// Moving either a pin or an annotation editor only repositions its tools;\n\t\t// it must not change the current toolbar visibility/selection state.\n\t\tlayoutTools();\n\t}\n''',
          'keep tools following editor window drag')

          replace_once(
          '''\tif (toolMain->curId == L"") {\n\t\tSetCursor(LoadCursor(nullptr, editorMode ? IDC_ARROW : IDC_SIZEALL));\n\t\treturn TRUE;\n\t}\n''',
          '''\tif (toolMain->curId == L"") {\n\t\tSetCursor(LoadCursor(nullptr, IDC_SIZEALL));\n\t\treturn TRUE;\n\t}\n''',
          'show move cursor for editor interior')

          path.write_text(text, encoding='utf-8')
          '@ | Set-Content apply_editor_drag.py -Encoding utf8
          python apply_editor_drag.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare pinned Ling dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lingCommit = 'b77448ec7e72b1b961d3c6f8f87502d8df72aa5f'
          New-Item -ItemType Directory -Force D:\project | Out-Null
          if (Test-Path D:\project\Ling) { Remove-Item -Recurse -Force D:\project\Ling }
          git clone --no-checkout https://github.com/xland/Ling.git D:\project\Ling
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C D:\project\Ling checkout --detach $lingCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $util = Get-Content D:\project\Ling\include\Util.h -Raw
          $util = $util.Replace('constexpr auto gen = [](size_t i, size_t idx) {', 'constexpr auto gen = [](std::wstring_view chars, size_t i, size_t idx) {')
          $util = $util.Replace('std::wstring{gen(I, I)...}', 'std::wstring{gen(chars, I, I)...}')
          Set-Content D:\project\Ling\include\Util.h $util -Encoding utf8
          $lingAppPath = 'D:\project\Ling\src\App.cpp'
          $lingApp = Get-Content $lingAppPath -Raw
          $oldTrayLine = 'tray->hIcon = LoadIcon(GetModuleHandle(nullptr), MAKEINTRESOURCE(1));'
          $newTrayCode = 'tray->hIcon = (HICON)LoadImageW(GetModuleHandle(nullptr), MAKEINTRESOURCE(2), IMAGE_ICON,' + "`r`n" +
            '            GetSystemMetrics(SM_CXSMICON), GetSystemMetrics(SM_CYSMICON), LR_DEFAULTCOLOR);' + "`r`n" +
            '        if (!tray->hIcon) {' + "`r`n" +
            '            tray->hIcon = LoadIcon(GetModuleHandle(nullptr), MAKEINTRESOURCE(1));' + "`r`n" +
            '        }'
          if ($lingApp.Contains($oldTrayLine)) {
            $lingApp = $lingApp.Replace($oldTrayLine, $newTrayCode)
            Set-Content $lingAppPath $lingApp -Encoding utf8
          }

      - name: Build Yoga and Ling
        shell: pwsh
        run: |
          msbuild D:\project\Ling\yoga\yoga.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=D:\project\Ling\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild D:\project\Ling\Ling.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=D:\project\Ling\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build StarCap test executable
        shell: pwsh
        run: |
          msbuild Src\StarCap.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=${{ github.workspace }}\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test executable
        uses: actions/upload-artifact@v4
        with:
          name: StarCap-v0.10.10-editor-window-drag-test
          path: x64/Release/StarCap.exe

      - name: Commit verified source and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item apply_editor_drag.py -Force
          Remove-Item .github/workflows/build-editor-window-drag-test.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Win/WinPin.cpp .github/workflows/build-editor-window-drag-test.yml
          git commit -m "Allow moving annotation editor before drawing tools are active"
          git push origin HEAD:fix/long-result-crop-mark
