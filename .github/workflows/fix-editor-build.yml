name: Fix Screenshot Editor Build

on:
  push:
    branches:
      - feature/snipaste-capture-ux
    paths:
      - .github/workflows/fix-editor-build.yml

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/snipaste-capture-ux
          fetch-depth: 0
      - name: Move editor-open queue to ToolCap
        shell: python
        run: |
          from pathlib import Path
          p = Path('Src/Win/WinCap.cpp')
          text = p.read_text(encoding='utf-8')
          old = '    ToolMain::queueEditorOpen();\n    WinPin::initEditor('
          if old not in text:
              raise SystemExit('WinCap editor queue marker not found')
          text = text.replace(old, '    WinPin::initEditor(', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('Src/Tool/ToolCap.cpp')
          text = p.read_text(encoding='utf-8')
          old = '\tif (btn->id == L"mark") {\n\t\twin->startEditor();\n\t}\n'
          new = '\tif (btn->id == L"mark") {\n\t\tToolMain::queueEditorOpen();\n\t\twin->startEditor();\n\t}\n'
          if old not in text:
              raise SystemExit('ToolCap mark marker not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Src/Win/WinCap.cpp Src/Tool/ToolCap.cpp
          git commit -m "Fix screenshot editor initialization"
          git push origin HEAD:feature/snipaste-capture-ux
      - name: Build feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run starcap-direct-build.yml --ref feature/snipaste-capture-ux
      - name: Cleanup workflow
        shell: bash
        run: |
          git pull --rebase origin feature/snipaste-capture-ux
          git rm .github/workflows/fix-editor-build.yml
          git commit -m "Remove temporary editor build fix workflow"
          git push origin HEAD:feature/snipaste-capture-ux
