name: Build StarCap v0.10.7 test

on:
  push:
    branches:
      - fix/diagnostics-log-appdata
    paths:
      - Src/**
      - Doc/version.json
      - .github/workflows/build-v0.10.7-test.yml

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout StarCap
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content 'Src\Version.h' -Raw
          $match = [regex]::Match($text, 'STARCAP_DISPLAY_VERSION\s+L"v([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $match.Success) { throw 'Unable to resolve StarCap version.' }
          $version = $match.Groups[1].Value
          $json = Get-Content 'Doc\version.json' -Raw | ConvertFrom-Json
          if (($json.version -join '.') -ne $version) { throw 'Version metadata mismatch.' }
          if ($version -ne '0.10.7') { throw "Unexpected test version: $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare pinned Ling dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lingCommit = 'b77448ec7e72b1b961d3c6f8f87502d8df72aa5f'
          New-Item -ItemType Directory -Force D:\project | Out-Null
          if (Test-Path D:\project\Ling) { Remove-Item -Recurse -Force D:\project\Ling }
          git clone --no-checkout https://github.com/xland/Ling.git D:\project\Ling
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C D:\project\Ling checkout --detach $lingCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $util = Get-Content D:\project\Ling\include\Util.h -Raw
          $util = $util.Replace('constexpr auto gen = [](size_t i, size_t idx) {', 'constexpr auto gen = [](std::wstring_view chars, size_t i, size_t idx) {')
          $util = $util.Replace('std::wstring{gen(I, I)...}', 'std::wstring{gen(chars, I, I)...}')
          Set-Content D:\project\Ling\include\Util.h $util -Encoding utf8

          $lingAppPath = 'D:\project\Ling\src\App.cpp'
          $lingApp = Get-Content $lingAppPath -Raw
          $oldTrayLine = 'tray->hIcon = LoadIcon(GetModuleHandle(nullptr), MAKEINTRESOURCE(1));'
          if (-not $lingApp.Contains($oldTrayLine)) { throw 'Ling tray icon load line changed.' }
          $newTrayCode = 'tray->hIcon = (HICON)LoadImageW(GetModuleHandle(nullptr), MAKEINTRESOURCE(2), IMAGE_ICON,' + "`r`n" +
            '            GetSystemMetrics(SM_CXSMICON), GetSystemMetrics(SM_CYSMICON), LR_DEFAULTCOLOR);' + "`r`n" +
            '        if (!tray->hIcon) {' + "`r`n" +
            '            tray->hIcon = LoadIcon(GetModuleHandle(nullptr), MAKEINTRESOURCE(1));' + "`r`n" +
            '        }'
          $lingApp = $lingApp.Replace($oldTrayLine, $newTrayCode)
          Set-Content $lingAppPath $lingApp -Encoding utf8

      - name: Build Yoga and Ling
        shell: pwsh
        run: |
          msbuild D:\project\Ling\yoga\yoga.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=D:\project\Ling\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild D:\project\Ling\Ling.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=D:\project\Ling\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build StarCap
        shell: pwsh
        run: |
          msbuild Src\StarCap.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=${{ github.workspace }}\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify test executable
        shell: pwsh
        run: |
          $exe = 'x64\Release\StarCap.exe'
          if (-not (Test-Path $exe)) { throw 'StarCap.exe was not produced.' }
          @'
          from pathlib import Path
          data = Path(r'x64\Release\StarCap.exe').read_bytes()
          required = [
              'StarCap/0.10.7',
              'StarCap_Diagnostics.log',
              'https://github.com/axing1218-source/StarCap/releases/latest/download/version.json',
              'https://github.com/axing1218-source/StarCap/releases/latest/download/StarCap.exe',
              'StarCap.update.exe'
          ]
          missing = [s for s in required if s.encode('utf-8') not in data and s.encode('utf-16le') not in data]
          if missing:
              raise SystemExit('Required runtime strings missing: ' + ', '.join(missing))
          print('v0.10.7 executable verification passed.')
          '@ | Set-Content verify_test.py -Encoding utf8
          python verify_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test executable
        uses: actions/upload-artifact@v4
        with:
          name: StarCap-v0.10.7-pre-release-test
          path: x64/Release/StarCap.exe
          if-no-files-found: error
